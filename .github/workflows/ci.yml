name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile the Python modules
        run: python -m py_compile server.py pipeline.py settings.py corpus_archive.py ids.py preferences.py onboarding.py images.py netsafe.py users.py
      - name: Validate the seed JSON
        run: |
          python - <<'PY'
          import json
          for f in ("feeds.sample.json", "categories.sample.json"):
              json.load(open(f))
              print(f, "ok")
          PY
      - name: Unit, API and image/HTML contract tests
        run: python -m unittest discover -s tests -v
      - name: Frontend script syntax check
        run: |
          python - <<'PY'
          import re
          html = open("digest.html", encoding="utf-8").read()
          scripts = re.findall(r"<script>([\s\S]*?)</script>", html)
          assert scripts, "no inline script found"
          open("/tmp/app.js", "w", encoding="utf-8").write("\n".join(scripts))
          PY
          node --check /tmp/app.js
      - name: Fallback illustrations exist for every topic
        run: |
          python - <<'PY'
          import os, images
          for t in images.FALLBACK_TOPICS:
              p = os.path.join("static", "fallback", t + ".svg")
              assert os.path.isfile(p), p
              assert open(p).read().lstrip().startswith("<svg"), p
          print("fallbacks ok")
          PY
