services:
  cruxwire:
    # Prebuilt image from GitHub Container Registry. To build from source
    # instead, run `docker compose up -d --build` (uses the local Dockerfile).
    image: ghcr.io/macnite/cruxwire:latest
    build: .
    container_name: cruxwire
    restart: unless-stopped
    # WARNING: this publishes the port on ALL host interfaces, and with the
    # default AUTH_MODE=none there is no login - anyone who can reach it
    # controls the app. Fine on a trusted LAN/tailnet; otherwise set
    # AUTH_MODE=local, put an authenticating reverse proxy in front, or bind it
    # to the host only with "127.0.0.1:${PORT:-8090}:8090". See SECURITY.md.
    ports:
      - "${PORT:-8090}:8090"
    environment:
      # Infrastructure wiring lives here in compose (not buried in .env).
      # Point this at your Ollama server. Which models to use is configured
      # in the app's Settings → Models, not here.
      #
      # Running Ollama natively on the SAME machine via Docker Desktop (Mac/Win)?
      # Use host.docker.internal - inside the container `localhost` is the
      # container, not your host:
      #     OLLAMA_HOST: http://host.docker.internal:11434
      OLLAMA_HOST: ${OLLAMA_HOST:-http://localhost:11434}
      PORT: 8090
      # Timezone the scheduler uses for the active-hours window. Without this
      # the container runs in UTC and runs fire in the wrong local window.
      # Override via .env or your shell, e.g. TZ=America/New_York.
      TZ: ${TZ:-Europe/Berlin}
      # User accounts: none (single user, no login) or local (accounts with
      # private feeds/likes/digests). See README → User accounts.
      AUTH_MODE: ${AUTH_MODE:-none}
    volumes:
      - cruxwire-data:/data        # local named volume - no NAS share
    # The app itself is tiny (pure stdlib); the RAM budget belongs to Ollama.
    # On a ~10 GB CPU-only host, qwen3.5:4b + nomic-embed-text fit with
    # OLLAMA_MAX_PARALLEL=1. Uncomment to bound this container explicitly:
    # mem_limit: 512m
    env_file:
      - path: .env                  # optional: extra overrides
        required: false

volumes:
  cruxwire-data:
