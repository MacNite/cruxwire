/* ── Explicit feedback (Like / Dislike) ───────────────── */
// Stored server-side (preferences.json) so votes follow you across devices.
// Independent of read / saved / dismissed: a vote never hides or saves a story,
// and Done (dismiss) is never counted as a dislike.
let votes = {};

async function loadVotes() {
  try {
    const r = await fetch('/feedback', { cache: 'no-store' });
    if (!r.ok) return false;
    const d = await r.json();
    const next = d.votes || {};
    const changed = JSON.stringify(next) !== JSON.stringify(votes);
    votes = next;
    return changed;
  } catch (e) { return false; }
}

function voteClass(a) { return votes[a.id] === -1 ? ' disliked' : ''; }

function voteButtons(a) {
  const v = votes[a.id] || 0;
  return `<span class="vote-group">`
    + `<button class="vote-btn like" data-vote-id="${a.id}" data-v="1" aria-label="Like" title="Like — more like this" aria-pressed="${v === 1}" onclick="vote('${a.id}', 1)">▲</button>`
    + `<button class="vote-btn dislike" data-vote-id="${a.id}" data-v="-1" aria-label="Dislike" title="Dislike — less like this" aria-pressed="${v === -1}" onclick="vote('${a.id}', -1)">▼</button>`
    + `</span>`;
}

function whyLine(a) {
  if (!a || !a.why) return '';
  return `<span class="why" title="Why this story? It is close to a story you liked.">Why this story? Similar to <b>“${escapeHtml(a.why)}”</b></span>`;
}

function updateVoteUI(id) {
  const v = votes[id] || 0;
  document.querySelectorAll(`[data-vote-id="${id}"]`).forEach(b => {
    b.setAttribute('aria-pressed', String(Number(b.dataset.v) === v));
  });
  const wrap = document.getElementById('wrap-' + id);
  if (wrap) wrap.classList.toggle('disliked', v === -1);
}

// Toggle semantics: pressing the active vote again undoes it.
window.vote = async function(id, v, context) {
  const prev = votes[id] || 0;
  const next = (context === 'onboarding') ? v : (prev === v ? 0 : v);
  votes[id] = next;
  if (!next) delete votes[id];
  updateVoteUI(id);
  try {
    const r = await fetch('/feedback', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id, vote: next || null, context }),
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
    if (context !== 'onboarding' && next && prev !== next) {
      toast(next === 1 ? 'Liked — similar stories will rank higher after the next refresh.'
                       : 'Disliked — similar stories will rank lower after the next refresh.');
    }
    return d;
  } catch (e) {
    if (prev) votes[id] = prev; else delete votes[id];
    updateVoteUI(id);
    toast('Could not save your vote: ' + (e.message || e));
    throw e;
  }
};

/* ── Refresh (fetch new stories through the existing pipeline) ── */
window.refreshFeeds = async function(btn) {
  if (btn) btn.disabled = true;
  try {
    const r = await fetch('/refresh', { method: 'POST' });
    const d = await r.json().catch(() => ({}));
    if (r.status === 202) toast('Fetching new stories… the feed updates when the run finishes.');
    else if (r.status === 409) toast('Already updating — hang tight.');
    else if (r.status === 429) toast(d.error || 'Refreshed a moment ago — try again shortly.');
    else toast('Refresh failed: ' + (d.error || `HTTP ${r.status}`));
    scheduleStatusPoll(800);
  } catch (e) {
    toast('Refresh failed — is the server reachable?');
  } finally {
    if (btn) setTimeout(() => { btn.disabled = false; }, 1500);
  }
};

/* ── Diversified ordering (mirrors pipeline.diversify) ── */
// Best effectiveScore first, but each repeat of a category / publisher costs a
// little, one category holds at most 4 of the top 10, and about one slot in
// four goes to an exploration pick (outside your liked topics) when the
// pipeline flagged any — so the feed never collapses onto one subject.
function diversifyOrder(list) {
  const share = (appSettings && typeof appSettings.exploration_share === 'number') ? appSettings.exploration_share : 0.25;
  const period = share > 0 ? Math.round(1 / share) : 0;
  const remaining = list.slice().sort((a, b) => effectiveScore(b) - effectiveScore(a));
  const haveExplore = remaining.some(a => a.explore);
  const tc = {}, sc = {}, out = [];
  const topic = a => a.category || '';
  const src = a => a.publisher || a.source || '';
  while (remaining.length) {
    const pos = out.length;
    let pool = remaining;
    if (period && haveExplore && pos % period === period - 1) {
      const ex = remaining.filter(a => a.explore);
      if (ex.length) pool = ex;
    }
    if (pos < 10) {
      const capped = pool.filter(a => (tc[topic(a)] || 0) < 4);
      if (capped.length) pool = capped;
    }
    let best = pool[0], bestV = -Infinity;
    for (const a of pool) {
      const v = effectiveScore(a) - 0.6 * (tc[topic(a)] || 0) - 0.4 * (sc[src(a)] || 0);
      if (v > bestV) { bestV = v; best = a; }
    }
    remaining.splice(remaining.indexOf(best), 1);
    out.push(best);
    tc[topic(best)] = (tc[topic(best)] || 0) + 1;
    sc[src(best)] = (sc[src(best)] || 0) + 1;
  }
  return out;
}

/* ── Compact feed (?view=compact) ─────────────────────── */
// Single-column, touch-friendly list for phones and the Home Assistant
// Webpage card. Order comes from GET /articles (server-ranked, diversified,
// paged); "Discover more" walks further down that ranking, never repeating.
// Offline / server error → falls back to ranking the loaded digest locally.
const cfeed = { ids: [], next: 0, loading: false, cat: null, gen: undefined, done: false, local: false };

function compactCardHTML(a) {
  const others = (a._clusterOthers || []).length;
  return `
    <article class="article-wrap ccard${voteClass(a)}" id="wrap-${a.id}">
      ${thumbBlock(a)}
      <div class="ccard-body">
        ${kicker(a)}
        <h3 class="ccard-title">${openLink(a, escapeHtml(a.title))}</h3>
        <div class="ccard-meta">${srcLine(a)}${others ? `<span>· ${others + 1} sources</span>` : ''}</div>
        ${a.summary ? `<p class="ccard-summary">${escapeHtml(a.summary)}</p>` : ''}
        ${whyLine(a)}
        ${clusterDisclosure(a)}
      </div>
      <div class="ccard-actions">
        ${voteButtons(a)}
        <button class="act later" onclick="saveForLater('${a.id}')" aria-label="Save for later">Save</button>
        <button class="act done" onclick="dismiss('${a.id}')" aria-label="Hide (not a dislike)">Hide</button>
        <a class="act open" href="${escapeAttr(a.url)}" target="_blank" rel="noopener" onclick="openArticle('${a.id}','${escapeAttr(a.url)}'); return false;" aria-label="Open original article">Open ↗</a>
      </div>
    </article>`;
}

function compactArticle(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return null;
  const cid = a.cluster_id || a.id;
  a._clusterOthers = allArticles.filter(x => (x.cluster_id || x.id) === cid && x !== a && !sharedState.readIds.has(x.id));
  return a;
}

function renderCompact() {
  if (cfeed.cat !== currentCat || cfeed.gen !== loadedGeneratedAt) {
    Object.assign(cfeed, { ids: [], next: 0, done: false, cat: currentCat, gen: loadedGeneratedAt, local: false });
    loadCompactPage();
    return;
  }
  const list = document.getElementById('cfeed-list');
  const items = cfeed.ids.map(compactArticle).filter(a => a && visible(a));
  list.innerHTML = items.length ? items.map(compactCardHTML).join('')
    : (cfeed.loading ? '<p class="empty">Loading your feed…</p>' : '<p class="empty">All caught up.</p>');
  const more = document.getElementById('cfeed-more');
  if (more) { more.disabled = cfeed.loading || cfeed.done; more.textContent = cfeed.loading ? 'Loading…' : 'Discover more'; }
  const note = document.getElementById('cfeed-note');
  if (note) note.textContent = cfeed.done
    ? 'You’ve seen everything ranked so far — Refresh feeds to fetch new stories.' : '';
}

async function loadCompactPage() {
  if (cfeed.loading || cfeed.done) return;
  cfeed.loading = true;
  renderCompact();
  const PAGE = 15;
  try {
    if (cfeed.local) throw new Error('local');
    const q = `/articles?offset=${cfeed.next}&limit=${PAGE}&category=${encodeURIComponent(currentCat)}`;
    const r = await fetch(q, { cache: 'no-store' });
    if (!r.ok) throw new Error(`HTTP ${r.status}`);
    const d = await r.json();
    for (const a of d.articles || []) {
      if (!allArticles.some(x => x.id === a.id)) allArticles.push(a);   // digest moved on: keep server copy
      if (!cfeed.ids.includes(a.id)) cfeed.ids.push(a.id);
    }
    cfeed.next = d.next_offset ?? cfeed.next;
    cfeed.done = d.next_offset == null;
  } catch (e) {
    // Offline or server error: rank the already-loaded digest locally.
    cfeed.local = true;
    const ranked = diversifyOrder(dedupeToReps(allArticles.filter(visible)));
    const page = ranked.filter(a => !cfeed.ids.includes(a.id)).slice(0, PAGE);
    cfeed.ids.push(...page.map(a => a.id));
    cfeed.done = page.length < PAGE;
  } finally {
    cfeed.loading = false;
    if (currentView === 'digest' && !digestSearchQuery.trim()) renderCompact();
  }
}

window.discoverMore = function() { loadCompactPage(); };

/* ── Onboarding wizard ────────────────────────────────── */
const OB_STEPS = ['welcome', 'sources', 'train', 'finish'];
const obState = { step: 'welcome', data: null, queue: [], busy: false, undo: [], msg: {},
                  exhausted: false, reviewOpen: false, review: null, seedsOpen: false, finishing: null };

function obProgress() {
  return (obState.data && obState.data.progress) || { likes: 0, dislikes: 0, topics: [], minLikes: 10, recommendedDislikes: 3, recommendedTopics: 3, canFinish: false };
}

async function obFetchStatus(batch = false, extra = '') {
  const exclude = obState.queue.map(c => c.id).join(',');
  const url = `/onboarding?batch=${batch ? 1 : 0}&n=8${exclude ? '&exclude=' + exclude : ''}${extra}`;
  const r = await fetch(url, { cache: 'no-store' });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const d = await r.json();
  obState.data = { ...(obState.data || {}), ...d };
  return d;
}

async function obPost(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const d = await r.json().catch(() => ({}));
  return { ok: r.ok, status: r.status, data: d };
}

window.openOnboarding = function(step = 'welcome') {
  obState.step = step;
  obState.msg = {};
  if (step === 'train') { obState.queue = []; obState.exhausted = false; }
  switchView('onboarding');
};

window.obGo = async function(step) {
  if (step === 'sources' || step === 'train') {
    const st = obState.data && obState.data.onboarding && obState.data.onboarding.status;
    if (st === 'not_started' || st === 'skipped') {
      const res = await obPost('/onboarding/status', { status: 'in_progress' });
      if (res.ok && obState.data) obState.data.onboarding = res.data.onboarding;
    }
  }
  obState.step = step;
  obState.msg = {};
  renderOnboarding();
  window.scrollTo({ top: 0 });
};

window.obSkipForNow = async function() {
  await obPost('/onboarding/status', { status: 'skipped' });
  toast('You can train your feed anytime in Settings → Personalize.');
  switchView('digest');
};

function obStepDots() {
  const idx = OB_STEPS.indexOf(obState.step);
  return `<div class="ob-steps" aria-hidden="true">${OB_STEPS.map((s, i) =>
    `<span class="ob-step-dot${i <= idx ? ' done' : ''}"></span>`).join('')}</div>`;
}

function renderOnboarding() {
  const el = document.getElementById('onboarding-content');
  if (!el) return;
  if (!obState.data) {
    el.innerHTML = '<p class="empty">Loading…</p>';
    obFetchStatus(false).then(renderOnboarding).catch(() => {
      el.innerHTML = '<p class="empty">Could not reach the server. <button class="ob-btn" onclick="renderOnboarding()">Retry</button></p>';
    });
    return;
  }
  const s = obState.step;
  el.innerHTML = obStepDots() + (s === 'welcome' ? obWelcomeHTML() : s === 'sources' ? obSourcesHTML()
    : s === 'train' ? obTrainHTML() : obFinishHTML());
  if (s === 'train') obAfterTrainRender();
}
window.renderOnboarding = renderOnboarding;

function obWelcomeHTML() {
  const ob = obState.data.onboarding || {};
  const p = obProgress();
  const resumable = ob.status === 'in_progress' && (p.likes > 0 || p.dislikes > 0);
  const again = ob.status === 'completed' || ob.status === 'skipped';
  return `
    <h2>${again ? 'Retrain your feed' : 'Welcome to Cruxwire'}</h2>
    <p class="lead">A private news reader that learns what you like. Everything runs on this server —
      your feeds, votes and the AI models (via your local Ollama). Nothing is sent to a cloud service.</p>
    <ul class="ob-points">
      <li><b>1. Choose sources</b> — RSS feeds or Google News searches.</li>
      <li><b>2. Rate stories</b> — like ${p.minLikes} you’d want to read, dislike a few you wouldn’t, skip the rest.</li>
      <li><b>3. Get your digest</b> — ranked for you, and it keeps learning from every like and dislike.</li>
    </ul>
    <p class="lead" style="font-size:13px;">Personalization is optional — you can skip and use the plain ranked digest.</p>
    <div class="ob-row">
      ${resumable ? `<button class="ob-btn primary" onclick="obGo('train')">Resume (${p.likes}/${p.minLikes} likes)</button>
                     <button class="ob-btn" onclick="obGo('sources')">Review sources</button>`
                  : `<button class="ob-btn primary" onclick="obGo('sources')">Get started</button>`}
      ${again ? `<button class="ob-btn ghost" onclick="switchView('digest')">Back to my feed</button>`
              : `<button class="ob-btn ghost" onclick="obSkipForNow()">Skip for now</button>`}
    </div>`;
}

function obMsg(key) {
  const m = obState.msg[key];
  return m ? `<div class="ob-msg ${m.kind}" role="${m.kind === 'err' ? 'alert' : 'status'}">${m.html}</div>` : '';
}

function obSourcesHTML() {
  const feeds = obState.data.feeds || [];
  const examples = obState.data.examples || [];
  const catOpts = Object.keys(CATS).filter(k => k !== 'all')
    .map(k => `<option value="${escapeAttr(k)}">${escapeHtml(CATS[k].label)}</option>`).join('');
  const feedRows = feeds.length ? feeds.map(f => `
      <li><span style="min-width:0;"><b>${escapeHtml(f.source)}</b><span class="u">${escapeHtml(f.url)}</span></span>
        <button class="ob-chip" onclick="obRemoveFeed('${escapeAttr(encodeURIComponent(f.url))}')" aria-label="Remove ${escapeAttr(f.source)}">Remove</button></li>`).join('')
    : '<li><span class="u" style="white-space:normal;">No sources yet — add one below or start from an example.</span></li>';
  return `
    <h2>Choose your sources</h2>
    <p class="lead">Add at least one RSS/Atom feed; three or more varied sources give the best results.
      Each feed is checked right away and you’ll see its latest headlines.</p>
    <div class="ob-section">
      <h3>Your sources (${feeds.length})</h3>
      <ul class="ob-feeds">${feedRows}</ul>
      ${obMsg('remove')}
    </div>
    <div class="ob-section">
      <h3>Add an RSS feed</h3>
      <div class="ob-row">
        <input class="feed-input ob-input" id="ob-url" type="url" inputmode="url" placeholder="https://example.com/feed.xml" aria-label="Feed URL">
      </div>
      <div class="ob-row">
        <input class="feed-input ob-input" id="ob-name" type="text" placeholder="Name (optional)" aria-label="Feed name">
        <select class="feed-select" id="ob-cat" aria-label="Category">${catOpts}</select>
        <button class="ob-btn primary" id="ob-add" onclick="obAddFeed()">Add &amp; check</button>
      </div>
      ${obMsg('add')}
      <div style="margin-top:14px;">
        <div class="settings-help" style="margin-bottom:8px;">Examples — tap to load into the form, then edit or add:</div>
        <div class="ob-chips">${examples.map((x, i) =>
          `<button class="ob-chip" onclick="obUseExample(${i})">${escapeHtml(x.source)}</button>`).join('')}</div>
      </div>
    </div>
    <div class="ob-section">
      <h3>Google News search</h3>
      <div class="settings-help" style="margin-bottom:8px;">Turn any topic into a feed (e.g. “heat pumps”, “Bundesliga”, “battery storage”).</div>
      <div class="ob-row">
        <input class="feed-input ob-input" id="ob-gq" type="text" placeholder="Search terms" aria-label="Google News search terms">
        <select class="feed-select" id="ob-glang" aria-label="Edition">
          <option value="en-US|US">English (US)</option><option value="en-GB|GB">English (UK)</option>
          <option value="de|DE">Deutsch (DE)</option><option value="fr|FR">Français (FR)</option>
        </select>
        <button class="ob-btn" onclick="obAddGoogle()">Add search</button>
      </div>
      ${obMsg('google')}
    </div>
    <div class="ob-footer">
      <button class="ob-btn ghost" onclick="obGo('welcome')">← Back</button>
      <span class="settings-help" style="margin:0;">${feeds.length && feeds.length < 3 ? 'Tip: 3+ varied sources work best.' : ''}</span>
      <button class="ob-btn primary" onclick="obGo('train')" ${feeds.length ? '' : 'disabled'}>Continue →</button>
    </div>`;
}

window.obUseExample = function(i) {
  const x = (obState.data.examples || [])[i];
  if (!x) return;
  document.getElementById('ob-url').value = x.url;
  document.getElementById('ob-name').value = x.source;
  document.getElementById('ob-url').focus();
};

function obSampleHTML(d) {
  const sample = (d.sample || []).slice(0, 5);
  return `Added <b>${escapeHtml(d.feed.source)}</b>${d.count ? ` — ${d.count} articles` : ''}.`
    + (sample.length ? `<ul>${sample.map(x => `<li>${escapeHtml(x.title)}</li>`).join('')}</ul>` : '');
}

async function obAddSource(body, key, btn) {
  if (btn) btn.disabled = true;
  obState.msg[key] = { kind: '', html: 'Checking feed…' };
  renderOnboarding();
  try {
    const res = await obPost('/onboarding/sources', body);
    if (res.ok && res.data.ok) {
      obState.msg[key] = { kind: 'ok', html: res.data.duplicate ? 'That feed is already in your list.' : obSampleHTML(res.data) };
      await obFetchStatus(false);
      obState.queue = [];   // new sources → fresh candidates
    } else {
      obState.msg[key] = { kind: 'err', html: escapeHtml(res.data.error || 'Could not add that feed.') };
    }
  } catch (e) {
    obState.msg[key] = { kind: 'err', html: 'Network error — is the server reachable?' };
  }
  renderOnboarding();
}

window.obAddFeed = function() {
  const url = document.getElementById('ob-url').value.trim();
  if (!url) { obState.msg.add = { kind: 'err', html: 'Enter a feed URL first.' }; renderOnboarding(); return; }
  obAddSource({ url, source: document.getElementById('ob-name').value.trim(),
                category: document.getElementById('ob-cat').value }, 'add', document.getElementById('ob-add'));
};

window.obAddGoogle = function() {
  const q = document.getElementById('ob-gq').value.trim();
  if (!q) { obState.msg.google = { kind: 'err', html: 'Enter some search terms.' }; renderOnboarding(); return; }
  const [lang, country] = document.getElementById('ob-glang').value.split('|');
  obAddSource({ query: q, lang, country, category: document.getElementById('ob-cat')?.value }, 'google');
};

window.obRemoveFeed = async function(encUrl) {
  const url = decodeURIComponent(encUrl);
  try {
    const r = await fetch(`/feeds?url=${encodeURIComponent(url)}`, { method: 'DELETE' });
    obState.msg.remove = r.ok ? null : { kind: 'err', html: 'Could not remove that feed.' };
    await obFetchStatus(false);
    obState.queue = [];
  } catch (e) {
    obState.msg.remove = { kind: 'err', html: 'Network error.' };
  }
  renderOnboarding();
};

/* Training */
function obTrainHTML() {
  const p = obProgress();
  const pct = Math.min(100, Math.round(100 * p.likes / Math.max(1, p.minLikes)));
  const c = obState.queue[0];
  const errs = (obState.data.feedErrors || []);
  const topicsN = (p.topics || []).length;
  const card = c ? obCardHTML(c) : (obState.exhausted ? `
      <div class="ob-card ob-empty">
        <p style="margin-bottom:12px;"><b>No more stories to rate right now.</b></p>
        <p style="margin-bottom:16px;font-size:13px;">Reload your feeds for fresh headlines, or add more sources.</p>
        <div class="ob-row" style="justify-content:center;">
          <button class="ob-btn primary" onclick="obReloadCandidates()">Reload feeds</button>
          <button class="ob-btn" onclick="obGo('sources')">Add feeds</button>
        </div>
      </div>` : `<div class="ob-card"><div class="ob-media"><div class="ob-skeleton"></div></div><div class="ob-card-body"><p class="empty" style="padding:16px 0;">Loading stories…</p></div></div>`);
  return `
    <h2>Rate some stories</h2>
    <p class="lead">Like stories you’d want to read; dislike ones you wouldn’t. Skip if unsure — skipping is never counted against a story.</p>
    <div class="ob-progress" aria-label="Progress">
      <div class="ob-bar" role="progressbar" aria-valuemin="0" aria-valuemax="${p.minLikes}" aria-valuenow="${Math.min(p.likes, p.minLikes)}"><span style="width:${pct}%"></span></div>
      <span class="ob-count">${p.likes}/${p.minLikes} likes</span>
    </div>
    <div class="ob-hints">
      <span class="${topicsN >= p.recommendedTopics ? 'met' : ''}">Topics liked: ${topicsN} (aim for ~${p.recommendedTopics})</span>
      <span class="${p.dislikes >= p.recommendedDislikes ? 'met' : ''}">Dislikes: ${p.dislikes} (${p.recommendedDislikes}–5 recommended)</span>
      ${errs.length ? `<span style="color:#c2410c;">${errs.length} feed${errs.length > 1 ? 's' : ''} couldn’t be loaded: ${errs.map(e => escapeHtml(e.source || e.url)).join(', ')}</span>` : ''}
    </div>
    ${card}
    <div class="ob-footer">
      <button class="ob-btn ghost" onclick="obGo('sources')">← Sources</button>
      <span class="ob-row">
        <button class="ob-btn ghost" onclick="obUndo()" ${obState.undo.length ? '' : 'disabled'} title="Undo last (U)">↶ Undo</button>
        <button class="ob-btn ghost" onclick="obToggleReview()" aria-expanded="${obState.reviewOpen}">Review votes (${p.likes + p.dislikes})</button>
      </span>
      <button class="ob-btn primary" onclick="obFinish()" ${p.canFinish ? '' : 'disabled'}
        title="${p.canFinish ? 'Build my feed' : `Like ${p.minLikes - p.likes} more to finish`}">Finish →</button>
    </div>
    ${obState.reviewOpen ? obReviewHTML() : ''}
    <details class="ob-section" style="margin-top:16px;" ${obState.seedsOpen ? 'open' : ''} ontoggle="obState.seedsOpen = this.open">
      <summary style="cursor:pointer;font-weight:600;font-size:14px;">Already have articles you like? Paste their links</summary>
      <div style="margin-top:10px;">
        <textarea class="feed-input" id="ob-seeds" placeholder="One article URL per line (up to 10)" aria-label="Liked article URLs"></textarea>
        <div class="ob-row" style="margin-top:8px;"><button class="ob-btn" onclick="obImportSeeds(this)">Import as likes</button></div>
        ${obMsg('seeds')}
      </div>
    </details>
    <p class="settings-help" style="margin-top:10px;">Keyboard: <b>L</b> like · <b>D</b> dislike · <b>S</b> skip · <b>U</b> undo</p>`;
}

function obFmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function obCardHTML(c) {
  const topic = (c.topic || 'news');
  return `
    <article class="ob-card" id="ob-card" data-id="${escapeAttr(c.id)}">
      <div class="ob-media" id="ob-media">
        <span class="ob-ph">${escapeHtml(topic)}</span>
        <div class="ob-skeleton"></div>
        <img id="ob-img" alt="" referrerpolicy="no-referrer" decoding="async">
      </div>
      <div class="ob-card-body">
        <div class="ob-card-meta"><b>${escapeHtml(c.publisher || c.source)}</b>${obFmtDate(c.published_at) ? `<span>· ${obFmtDate(c.published_at)}</span>` : ''}<span>· ${escapeHtml(topic)}</span></div>
        <h3 class="ob-card-title">${escapeHtml(c.title)}</h3>
        ${c.description ? `<p class="ob-card-desc">${escapeHtml(c.description)}</p>` : ''}
        <a class="ob-card-link" href="${escapeAttr(c.url)}" target="_blank" rel="noopener noreferrer">Read the article ↗</a>
      </div>
      <div class="ob-actions">
        <button class="ob-btn dislike" onclick="obAct('dislike')" aria-label="Dislike" ${obState.busy ? 'disabled' : ''}>▼ Dislike</button>
        <button class="ob-btn" onclick="obAct('skip')" aria-label="Skip" ${obState.busy ? 'disabled' : ''}>Skip</button>
        <button class="ob-btn like" onclick="obAct('like')" aria-label="Like" ${obState.busy ? 'disabled' : ''}>▲ Like</button>
      </div>
    </article>`;
}

// Image resolution on the client: RSS image → /image (server og:image lookup,
// cached) → local topic illustration. A skeleton shows meanwhile; the 16:9 box
// never changes size and never shows a broken icon. Voting never waits on it.
const obImageCache = {};
function obLoadImage(c) {
  const img = document.getElementById('ob-img');
  const media = document.getElementById('ob-media');
  if (!img || !media) return;
  const stillCurrent = () => document.getElementById('ob-card')?.dataset.id === c.id;
  let tried = new Set(), timer = null;
  const finish = () => { clearTimeout(timer); media.classList.add('ready'); };
  const useFallback = () => {
    if (!stillCurrent()) return;
    clearTimeout(timer);
    img.onload = () => { img.classList.add('loaded'); finish(); };
    img.onerror = () => { img.remove(); finish(); };   // topic label (.ob-ph) remains
    img.src = c.fallback_image || fallbackFor(c);
  };
  const tryUrl = (url, next) => {
    if (!url || tried.has(url)) { next(); return; }
    tried.add(url);
    clearTimeout(timer);
    timer = setTimeout(() => { if (stillCurrent() && !img.classList.contains('loaded')) next(); }, 8000);
    img.onload = () => { if (img.naturalWidth < 40) { next(); return; } img.classList.add('loaded'); finish(); obImageCache[c.id] = url; };
    img.onerror = () => next();
    img.src = url;
  };
  const resolveServer = async () => {
    if (!stillCurrent()) return;
    try {
      const r = await fetch('/image?id=' + encodeURIComponent(c.id));
      const d = r.ok ? await r.json() : {};
      if (d.fallback_image) c.fallback_image = d.fallback_image;
      if (stillCurrent()) tryUrl(d.image, useFallback);
    } catch (e) { useFallback(); }
  };
  if (obImageCache[c.id]) tryUrl(obImageCache[c.id], resolveServer);
  else if (c.image) tryUrl(c.image, resolveServer);
  else resolveServer();
}

function obPreload(c) {
  if (c && c.image && !obImageCache[c.id]) { const im = new Image(); im.referrerPolicy = 'no-referrer'; im.src = c.image; }
}

async function obEnsureQueue() {
  if (obState.queue.length >= 3 || obState.exhausted || obState.loadingQueue) return;
  obState.loadingQueue = true;
  try {
    const d = await obFetchStatus(true);
    const have = new Set(obState.queue.map(c => c.id));
    const fresh = (d.candidates || []).filter(c => !have.has(c.id));
    obState.queue.push(...fresh);
    obState.exhausted = !obState.queue.length && !!d.exhausted;
  } catch (e) {
    obState.msg.train = { kind: 'err', html: 'Could not load stories.' };
  } finally {
    obState.loadingQueue = false;
  }
}

function obAfterTrainRender() {
  const c = obState.queue[0];
  if (c) {
    obLoadImage(c);
    obPreload(obState.queue[1]);
  }
  if (obState.queue.length < 3 && !obState.exhausted && !obState.loadingQueue) {
    const hadCard = !!c;
    obEnsureQueue().then(() => {
      if (currentView === 'onboarding' && obState.step === 'train' && (!hadCard || !document.getElementById('ob-card'))) renderOnboarding();
    });
  }
}

window.obReloadCandidates = async function() {
  obState.exhausted = false;
  obState.queue = [];
  renderOnboarding();
  try { await obFetchStatus(true, '&force=1').then(d => { obState.queue = d.candidates || []; obState.exhausted = !!d.exhausted; }); }
  catch (e) { obState.exhausted = true; }
  renderOnboarding();
};

window.obAct = async function(kind) {
  const c = obState.queue[0];
  if (!c || obState.busy) return;
  obState.busy = true;
  try {
    if (kind === 'skip') {
      await obPost('/onboarding/skip', { id: c.id });
    } else {
      const d = await vote(c.id, kind === 'like' ? 1 : -1, 'onboarding');
      if (d && d.progress) obState.data.progress = d.progress;
    }
    obState.undo.push({ card: c, kind });
    if (obState.undo.length > 50) obState.undo.shift();
    obState.queue.shift();
    obState.review = null;
  } catch (e) {
    /* vote() already toasted; keep the card */
  } finally {
    obState.busy = false;
  }
  renderOnboarding();
};

window.obUndo = async function() {
  const last = obState.undo.pop();
  if (!last) return;
  if (last.kind !== 'skip') {
    try {
      const d = await vote(last.card.id, 0, 'onboarding');
      if (d && d.progress) obState.data.progress = d.progress;
    } catch (e) { obState.undo.push(last); return; }
  }
  obState.queue.unshift(last.card);
  obState.exhausted = false;
  obState.review = null;
  renderOnboarding();
};

window.obFinish = async function() {
  obState.step = 'finish';
  obState.finishing = { phase: 'saving' };
  renderOnboarding();
  const res = await obPost('/onboarding/complete', {});
  if (!res.ok) {
    obState.finishing = { phase: 'error', error: res.data.error || 'Could not finish.' };
    renderOnboarding();
    return;
  }
  obState.data.onboarding = res.data.onboarding;
  obState.finishing = { phase: 'building', refresh: res.data.refresh };
  renderOnboarding();
  obWatchRun();
};

async function obWatchRun() {
  for (let i = 0; i < 400 && obState.step === 'finish'; i++) {
    let st = null;
    try { st = await (await fetch('/status', { cache: 'no-store' })).json(); } catch (e) {}
    if (st && !st.running) {
      try {
        const data = await (await fetch(DIGEST_URL, { cache: 'no-store' })).json();
        applyDigestData(data);
        pendingDigest = null;
      } catch (e) {}
      obState.finishing = { phase: 'ready' };
      if (currentView === 'onboarding') renderOnboarding();
      return;
    }
    obState.finishing.phaseLabel = st && st.phase;
    if (currentView === 'onboarding') renderOnboarding();
    await new Promise(r => setTimeout(r, 3000));
  }
}

/* ── Background sync ──────────────────────────────────── */
let backgroundSyncTimer = null;
const BACKGROUND_SYNC_MS = 30000;

function startBackgroundSync() {
  // Re-fetch on tab focus / visibility — that's when staleness matters most
  // (you switched back from another device or another tab).
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') refreshFromRemote();
  });
  window.addEventListener('focus', () => refreshFromRemote());
  window.addEventListener('online', () => {
    // Network came back: flush any queued retry immediately and pull fresh state.
    if (syncRetryTimer) { clearTimeout(syncRetryTimer); syncRetryTimer = null; }
    saveSharedState().catch(() => {});
    refreshFromRemote();
  });

  // Slow poll while the tab is visible. Cheap (just one GET) and bounds
  // worst-case staleness for an always-on tab.
  const tick = () => {
    if (document.visibilityState === 'visible') refreshFromRemote();
  };
  backgroundSyncTimer = setInterval(tick, BACKGROUND_SYNC_MS);
}

/* ── Pipeline run status + auto-surface fresh digests ──── */
let loadedGeneratedAt = null;   // generated_at of the digest currently rendered
let pendingDigest = null;       // a newer digest fetched but not yet shown
let pendingNewCount = 0;        // genuinely-new visible stories in pendingDigest
let statusPollTimer = null;
let lastRunning = false;

// How many stories in `data` are actually new to Home: a fresh id (not in the
// current digest), dated today, not already read or saved — then de-duplicated
// the same way the grid is, so the number matches the cards you'll see. This is
// what the pill reports, NOT the digest's raw article_count (which counts every
// article, most of which you've already seen or that collapse into existing
// coverage).
function countNewStories(data) {
  const oldIds = new Set(allArticles.map(a => a.id));
  const inLater = laterIdSet();
  const fresh = (data.articles || []).filter(a =>
    !oldIds.has(a.id) && isToday(a) && !sharedState.readIds.has(a.id) && !inLater.has(a.id));
  return dedupeToReps(fresh).length;
}

function applyDigestData(data) {
  // Order: today's stories first (by score), then recent past (by recency).
  allArticles = (data.articles || []).sort((a, b) => {
    const at = isToday(a) ? 1 : 0, bt = isToday(b) ? 1 : 0;
    if (at !== bt) return bt - at;
    if (at && bt)  return b.score - a.score;
    const ds = new Date(b.published_at) - new Date(a.published_at);
    return ds !== 0 ? ds : b.score - a.score;
  });
  loadedGeneratedAt = data.generated_at || null;
  const genDate = data.generated_at ? new Date(data.generated_at) : new Date();
  document.getElementById('header-date').textContent =
    '— ' + genDate.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function refreshRunPill(running, phase) {
  const pill = document.getElementById('run-pill');
  if (!pill) return;
  if (running) {
    pill.className = 'run-pill running';
    pill.innerHTML = `<span class="run-spinner"></span>Updating${phase ? ' · ' + phase : ''}`;
    pill.onclick = null;
    pill.style.display = 'inline-flex';
  } else if (pendingDigest) {
    const n = pendingNewCount;
    pill.className = 'run-pill ready';
    // Honest about what will change: a count only when there are genuinely new
    // stories, otherwise just "updated" (re-scored/re-ranked, nothing new).
    pill.textContent = n > 0
      ? `↑ ${n} new ${n === 1 ? 'story' : 'stories'} — refresh`
      : 'Digest updated — refresh';
    pill.onclick = applyPendingDigest;
    pill.style.display = 'inline-flex';
  } else {
    pill.style.display = 'none';
    pill.onclick = null;
  }
}

window.applyPendingDigest = function() {
  if (!pendingDigest) return;
  applyDigestData(pendingDigest);
  pendingDigest = null;
  refreshRunPill(false);
  rerenderActiveView();
  if (currentView === 'digest') window.scrollTo({ top: 0, behavior: 'smooth' });
};

async function checkForNewDigest() {
  try {
    const res = await fetch(DIGEST_URL, { cache: 'no-store' });
    const data = await res.json();
    if (data && data.generated_at && data.generated_at !== loadedGeneratedAt) {
      pendingDigest = data;
      pendingNewCount = countNewStories(data);
      refreshRunPill(false);
    }
  } catch (e) { /* transient; try again next poll */ }
}

function scheduleStatusPoll(delay) {
  if (statusPollTimer) clearTimeout(statusPollTimer);
  statusPollTimer = setTimeout(() => {
    if (document.visibilityState === 'hidden') { scheduleStatusPoll(delay); return; }
    pollStatus();
  }, delay);
}

async function pollStatus() {
  let st = null;
  try { const r = await fetch('/status', { cache: 'no-store' }); st = await r.json(); } catch (e) {}
  const running = !!(st && st.running);
  refreshRunPill(running, st && st.phase);
  // Keep the Runs log live while it's open (updates the in-progress row and
  // surfaces a run the moment it lands or fails).
  if (currentView === 'settings' && settingsTab === 'runs') refreshRuns();
  // A run just finished — see if it produced a fresh digest to surface.
  if (lastRunning && !running) await checkForNewDigest();
  lastRunning = running;
  // Poll fast while a run is active, slow when idle.
  scheduleStatusPoll(running ? 3000 : 25000);
}

/* ── Accounts ─────────────────────────────────────────── */
// `ME` comes from /auth/me. With AUTH_MODE=none it is {mode:'none'} and the
// app behaves exactly as the single-user version (everyone is the admin).
let ME = { mode: 'none', user: null };
const multiUser = () => ME.mode && ME.mode !== 'none';
const isAdmin = () => !multiUser() || !!(ME.user && ME.user.role === 'admin');

// Any API call that comes back 401 means the session ended: go sign in.
const _rawFetch = window.fetch.bind(window);
window.fetch = async function(input, init) {
  const res = await _rawFetch(input, init);
  const url = typeof input === 'string' ? input : (input && input.url) || '';
  if (res.status === 401 && !url.includes('/auth/')) location.href = '/login';
  return res;
};

async function loadMe() {
  try { ME = await (await _rawFetch('/auth/me', { cache: 'no-store' })).json(); }
  catch (e) { return; }   // offline: keep going on the local cache
  if (multiUser() && !ME.user) { location.href = '/login'; throw new Error('Login required'); }
  // A different account on this browser: never show the previous one's cache.
  try {
    const uid = ME.user ? ME.user.id : 'owner';
    const prev = localStorage.getItem('cw_uid');
    if (prev && prev !== uid) {
      [READ_KEY, LATER_KEY, HISTORY_KEY, VIEW_STATE_KEY, STATE_UPDATED_KEY, SOURCE_STATS_KEY, LEARNING_KEY]
        .forEach(k => localStorage.removeItem(k));
    }
    localStorage.setItem('cw_uid', uid);
  } catch (e) {}
  const btn = document.getElementById('account-btn');
  if (btn && multiUser() && ME.user) {
    btn.textContent = ME.user.display_name || ME.user.username;
    btn.style.display = '';
  }
}

      <td><select class="feed-select" ${self ? 'disabled' : ''} onchange="updateUser('${u.id}', { role: this.value })">
        <option value="user"${u.role === 'user' ? ' selected' : ''}>User</option>
        <option value="admin"${u.role === 'admin' ? ' selected' : ''}>Admin</option></select></td>
      <td style="color:var(--text2);font-size:12px">${u.disabled ? 'Disabled' : (u.last_login_at ? 'Last sign-in ' + escapeHtml(u.last_login_at.slice(0, 10)) : 'Never signed in')}</td>
      <td style="white-space:nowrap;text-align:right">
        <button class="feed-btn" onclick="resetUserPassword('${u.id}', '${escapeAttr(u.username)}')">Reset password</button>
        ${self ? '' : `<button class="feed-btn" onclick="updateUser('${u.id}', { disabled: ${!u.disabled} })">${u.disabled ? 'Enable' : 'Disable'}</button>`}
        ${self || u.legacy ? '' : `<button class="feed-btn" onclick="deleteUser('${u.id}', '${escapeAttr(u.username)}')">Delete</button>`}
      </td></tr>`;
  }).join('');
  pane.innerHTML = `
    <div class="settings-section">
      <div class="settings-h">Users <span class="settings-h-count">${usersList.length}</span></div>
      <div class="settings-help">Each user has private feeds, categories, likes and reading history, and their own ranked digest.
        Articles are fetched and scored by the model once, however many users follow them. Admins can also change the global settings (models, schedule, ingestion).</div>
      <div style="overflow-x:auto"><table class="stats-table"><tbody>${rows}</tbody></table></div>
      <div class="cfg-status" id="cfg-status-users" style="margin-top:8px"></div>
    </div>
    <div class="settings-section">
      <div class="settings-h">Add user</div>
      <div class="cfg-grid">
        <div class="cfg-row"><label class="cfg-label" for="nu-username">Username <span class="cfg-help">Letters, digits, . _ @ -</span></label>
          <input class="feed-input" id="nu-username" autocomplete="off" autocapitalize="none" spellcheck="false"></div>
        <div class="cfg-row"><label class="cfg-label" for="nu-name">Display name <span class="cfg-help">Optional.</span></label>
          <input class="feed-input" id="nu-name" autocomplete="off"></div>
        <div class="cfg-row"><label class="cfg-label" for="nu-password">Initial password <span class="cfg-help">At least 8 characters. They can change it under Settings → Account.</span></label>
          <input class="feed-input" id="nu-password" type="password" autocomplete="new-password"></div>
        <div class="cfg-row"><label class="cfg-label" for="nu-role">Role <span class="cfg-help">Admins manage users and global settings.</span></label>
          <select class="feed-select" id="nu-role"><option value="user">User</option><option value="admin">Admin</option></select></div>
      </div>
      <div class="cfg-actions">
        <button class="feed-btn primary" onclick="createUser()">Add user</button>
        <span class="cfg-status" id="cfg-status-newuser"></span>
      </div>
    </div>`;
}

async function usersCall(method, url, body) {
  const r = await fetch(url, { method, headers: { 'Content-Type': 'application/json' },
                               body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || `HTTP ${r.status}`);
  usersList = null;
  return d;
}

function rerenderUsers(scope, kind, msg) {
  const pane = document.getElementById('settings-pane');
  if (pane && settingsTab === 'users') {
    renderUsersPane(pane).then(() => { if (msg) setCfgStatus(scope, kind, msg); });
  }
}

window.createUser = async function() {
  const body = {
    username: document.getElementById('nu-username').value.trim(),
    display_name: document.getElementById('nu-name').value.trim(),
    password: document.getElementById('nu-password').value,
    role: document.getElementById('nu-role').value,
  };
  setCfgStatus('newuser', 'muted', 'Creating…');
  try {
    const u = await usersCall('POST', '/users', body);
    rerenderUsers('users', 'ok', `Created ${u.username}. They'll set up feeds on first sign-in.`);
  } catch (e) { setCfgStatus('newuser', 'err', e.message || String(e)); }
};

window.updateUser = async function(id, patch) {
  try { await usersCall('PUT', '/users?id=' + encodeURIComponent(id), patch); rerenderUsers('users', 'ok', 'Saved.'); }
  catch (e) { usersList = null; rerenderUsers('users', 'err', e.message || String(e)); }
};

window.resetUserPassword = async function(id, username) {
  const pw = prompt(`New password for ${username} (at least 8 characters). Their other sessions will be signed out.`);
  if (!pw) return;
  await updateUser(id, { password: pw });
};

window.deleteUser = async function(id, username) {
  if (!confirm(`Delete ${username} and all of their feeds, likes and history? This cannot be undone.`)) return;
  try { await usersCall('DELETE', '/users?id=' + encodeURIComponent(id)); rerenderUsers('users', 'ok', `Deleted ${username}.`); }
  catch (e) { setCfgStatus('users', 'err', e.message || String(e)); }
};

async function loadDigest() {
  try { await loadMe(); } catch (e) { return; }
  const statusEl = document.getElementById('status-screen');
  const pageEl   = document.querySelector('.page');
  const markDone = (id) => document.getElementById(id)?.classList.add('done');

  const digestPromise = (async () => {
    const res = await fetch(DIGEST_URL, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    markDone('sync-digest');
    return data;
  })();

  const statePromise = (async () => {
    const remote = await loadRemoteState();
    markDone('sync-state');
    return remote;
  })();

  const catsPromise = (async () => {
    try { const r = await fetch('/categories', { cache: 'no-store' }); return await r.json(); }
    catch (e) { return null; }
  })();

  // Onboarding status (cheap: no candidate batch) + explicit votes.
  const obPromise = (async () => {
    try { const r = await fetch('/onboarding?batch=0', { cache: 'no-store' }); return r.ok ? await r.json() : null; }
    catch (e) { return null; }
  })();

  try {
    const [data, remoteState, cats, ob] = await Promise.all([digestPromise, statePromise, catsPromise, obPromise, loadVotes()]);

    buildCats(cats);   // before any render so nav/colors reflect the config
    applyDigestData(data);

    // Server is the source of truth. If we got it, replace whatever
    // localStorage had (stale local state was the iPad-resurrection bug).
    // If the server is unreachable, fall back to local cache so the app
    // still renders something offline.
    applySharedState(remoteState || loadLocalState());
    // Apply any pending time-decay on the source-affinity counters once the
    // canonical state has landed; persists asynchronously if it ran.
    if (maybeDecayLearning()) saveSharedState().catch(() => {});
    saveLocalState(sharedState);

    // First run (or an interrupted one): open the wizard instead of the feed.
    // `?onboarding=1` forces it; `?view=compact` keeps the phone layout.
    const forceOb = new URLSearchParams(location.search).get('onboarding') === '1';
    if (ob && ob.onboarding) obState.data = ob;
    if (currentView === 'onboarding') currentView = 'digest';
    // An embedded/phone feed (Home Assistant card) always opens on Home.
    if (COMPACT) { currentView = 'digest'; currentCat = digestCat || 'all'; }
    if (forceOb || (ob && ob.onboarding && ['not_started', 'in_progress'].includes(ob.onboarding.status))) {
      obState.step = 'welcome';
      currentView = 'onboarding';
    }

    setActiveView(currentView);
    buildCatNav();
    updateCatCounts();
    updateBadges();
    if (currentView === 'history')       renderHistory();
    else if (currentView === 'later')    renderLater();
    else if (currentView === 'settings') renderSettings();
    else if (currentView === 'onboarding') renderOnboarding();
    else render();

    statusEl.style.display = 'none';
    pageEl.classList.remove('not-ready');

    startBackgroundSync();
    scheduleStatusPoll(2000);   // begin watching pipeline runs
  } catch(err) {
    statusEl.innerHTML = `<div style="text-align:center;">
      <div style="font-size:13px;color:var(--text3);margin-bottom:8px;">Could not load digest</div>
      <div style="font-size:12px;color:var(--text3);">${err.message}</div>
    </div>`;
  }
}

loadDigest();
</script>
</body>
</html>
