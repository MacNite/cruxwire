<script>
/* ── Theme (light is default; .dark opts in) ──────────── */
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.classList.add('dark');
}

function toggleTheme() {
  const isDark = document.documentElement.classList.toggle('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
}

/* ── Layout mode ──────────────────────────────────────── */
// `?view=compact` → single-column, touch-friendly feed (phones, Home Assistant
// Webpage card). The default magazine layout is unchanged.
const COMPACT = new URLSearchParams(location.search).get('view') === 'compact';
if (COMPACT) document.body.classList.add('compact');

/* ── Config ───────────────────────────────────────────── */
const DIGEST_URL        = './digest.json';
const STATE_URL         = '/state';
const READ_KEY          = 'digest_read_v1';
const LATER_KEY         = 'digest_read_later';
const HISTORY_KEY       = 'digest_history_v1';
const VIEW_STATE_KEY    = 'digest_view_state_v1';
const STATE_UPDATED_KEY = 'digest_state_updated_at';
const SOURCE_STATS_KEY  = 'digest_source_stats_v1';
const LEARNING_KEY      = 'digest_learning_v1';
const HERO_THRESH       = 8.0;   // effectiveScore at/above this is "lead" material
const LEAD_MAX          = 4;     // cap the lead tier so it stays editorial
const MID_THRESH        = 5.5;   // (legacy; kept for any external reference)
const HISTORY_DAYS      = 3; // keep today + 2 prior calendar days

const DEFAULT_VIEW_STATE = { currentView: 'digest', currentCat: 'all', digestCat: 'all', showScores: false };

/* ── Category metadata (c = accent color) ─────────────── */
// Built from GET /categories at load (see buildCats); this is the fallback if
// that fetch fails. Categories are configured server-side in categories.json.
let CATS = {
  all:          { label: 'All' },
  ai:           { label: 'AI',           c: 'var(--c-ai)' },
  tech:         { label: 'Tech',         c: 'var(--c-tech)' },
  gaming:       { label: 'Gaming',       c: 'var(--c-gaming)' },
  music:        { label: 'Music',        c: 'var(--c-music)' },
  woodworking:  { label: 'Woodworking',  c: 'var(--c-woodworking)' },
  photography:  { label: 'Photography',  c: 'var(--c-photography)' },
  devtools:     { label: 'Dev Tools',    c: 'var(--c-devtools)' },
  pm:           { label: 'Product',      c: 'var(--c-pm)' },
  productivity: { label: 'Productivity', c: 'var(--c-productivity)' },
};

// Rebuild CATS from the server's category config: {all} + one {label, color}
// per category, in config order (drives nav order + card colors).
function buildCats(list) {
  if (!Array.isArray(list) || !list.length) return;
  const next = { all: { label: 'All' } };
  for (const c of list) {
    if (c && c.key) next[c.key] = { label: c.label || c.key, c: c.color || '#8a90a0' };
  }
  CATS = next;
}

/* ── State helpers ────────────────────────────────────── */
let allArticles = [];
let sharedState = {
  readIds: new Set(),
  later: [],
  history: [],
  viewState: { ...DEFAULT_VIEW_STATE },
  sourceStats: {},
  learning: { lastDecayAt: null },
  updatedAt: null,
};

function normalizeSourceStats(raw) {
  if (!raw || typeof raw !== 'object') return {};
  const out = {};
  for (const [source, counters] of Object.entries(raw)) {
    if (typeof source !== 'string' || !counters || typeof counters !== 'object') continue;
    out[source] = {
      opens: Number(counters.opens) || 0,
      saves: Number(counters.saves) || 0,
      dismisses: Number(counters.dismisses) || 0,
    };
  }
  return out;
}

function normalizeState(raw = {}) {
  const viewState = raw.viewState || {};
  const learning = raw.learning && typeof raw.learning === 'object' ? raw.learning : {};
  return {
    updatedAt: raw.updatedAt || null,
    readIds: new Set(Array.isArray(raw.readIds) ? raw.readIds : []),
    later: Array.isArray(raw.later) ? raw.later : [],
    history: Array.isArray(raw.history) ? raw.history : [],
    viewState: {
      currentView: viewState.currentView || 'digest',
      currentCat: viewState.currentCat || 'all',
      digestCat: viewState.digestCat || 'all',
      showScores: !!viewState.showScores,
    },
    sourceStats: normalizeSourceStats(raw.sourceStats),
    learning: { lastDecayAt: typeof learning.lastDecayAt === 'string' ? learning.lastDecayAt : null },
  };
}

function migrateDailyHistory() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('digest_history_')) keys.push(key);
  }
  const history = [];
  keys.forEach((key) => {
    const items = JSON.parse(localStorage.getItem(key) || '[]');
    if (Array.isArray(items)) history.push(...items);
    localStorage.removeItem(key);
  });
  return history;
}

function loadLocalState() {
  const readIds = new Set(JSON.parse(localStorage.getItem(READ_KEY) || '[]'));
  const later = JSON.parse(localStorage.getItem(LATER_KEY) || '[]');
  const history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
  const viewState = JSON.parse(localStorage.getItem(VIEW_STATE_KEY) || JSON.stringify(DEFAULT_VIEW_STATE));
  const updatedAt = localStorage.getItem(STATE_UPDATED_KEY);
  const sourceStats = normalizeSourceStats(JSON.parse(localStorage.getItem(SOURCE_STATS_KEY) || '{}'));
  const learning = JSON.parse(localStorage.getItem(LEARNING_KEY) || '{}');

  const migratedHistory = migrateDailyHistory();
  const mergedHistory = [...history];
  migratedHistory.forEach((item) => {
    if (item && item.id && !mergedHistory.find((h) => h.id === item.id)) mergedHistory.push(item);
  });

  return {
    updatedAt,
    readIds,
    later,
    history: mergedHistory,
    viewState,
    sourceStats,
    learning: { lastDecayAt: typeof learning.lastDecayAt === 'string' ? learning.lastDecayAt : null },
  };
}

function saveLocalState(state) {
  localStorage.setItem(READ_KEY, JSON.stringify([...state.readIds]));
  localStorage.setItem(LATER_KEY, JSON.stringify(state.later));
  localStorage.setItem(HISTORY_KEY, JSON.stringify(state.history));
  localStorage.setItem(VIEW_STATE_KEY, JSON.stringify(state.viewState));
  localStorage.setItem(STATE_UPDATED_KEY, state.updatedAt || new Date().toISOString());
  localStorage.setItem(SOURCE_STATS_KEY, JSON.stringify(state.sourceStats || {}));
  localStorage.setItem(LEARNING_KEY, JSON.stringify(state.learning || { lastDecayAt: null }));
}

async function loadRemoteState() {
  try {
    const res = await fetch(STATE_URL);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    return normalizeState(await res.json());
  } catch (err) {
    return null;
  }
}

async function saveRemoteState(state) {
  const payload = {
    ...state,
    readIds: [...state.readIds],
  };

  const res = await fetch(STATE_URL, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  });

  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return normalizeState(await res.json());
}

function statesDiffer(a, b) {
  if (a.readIds.size !== b.readIds.size) return true;
  if (a.later.length !== b.later.length) return true;
  if (a.history.length !== b.history.length) return true;
  return false;
}

function applySharedState(state) {
  // readIds is append-only — you never un-read a story. Union the incoming set
  // with whatever is already in memory so a stale GET, or the server's echo of
  // an older in-flight PUT snapshot, can never *remove* an id we just added.
  // That removal is what let a freshly-dismissed cluster reappear on the next
  // background poll or focus-refresh (the markClusterRead additions were getting
  // clobbered). later/history have genuine removals, so they take the incoming
  // value as before.
  const readIds = new Set(sharedState.readIds);
  for (const id of state.readIds) readIds.add(id);
  sharedState = {
    ...state,
    readIds,
    viewState: { ...state.viewState },
  };

  // The wizard is a transient, local view: a sync echo must never pull the
  // user out of it (or persist it as the view to restore on next load).
  if (currentView !== 'onboarding') currentView = sharedState.viewState.currentView;
  if (currentView === 'onboarding' && sharedState.viewState.currentView === 'onboarding') {
    sharedState.viewState.currentView = 'digest';
  }
  currentCat = sharedState.viewState.currentCat;
  digestCat = sharedState.viewState.digestCat;
}

let pendingRemoteSave = false;
let queuedRemoteSave = false;
let syncFailureCount = 0;
let syncRetryTimer = null;

function scheduleRetry() {
  if (syncRetryTimer) return;
  // Exponential backoff capped at 30s; resets on success.
  const delay = Math.min(30000, 1000 * Math.pow(2, Math.max(0, syncFailureCount - 1)));
  syncRetryTimer = setTimeout(() => {
    syncRetryTimer = null;
    saveSharedState().catch(() => {});
  }, delay);
}

function setSyncStatus(state, message) {
  const el = document.getElementById('sync-status');
  if (!el) return;
  el.dataset.state = state;
  el.textContent = message || '';
  el.style.display = state === 'idle' ? 'none' : 'inline-flex';
}

async function saveSharedState({ remote = true } = {}) {
  sharedState.updatedAt = new Date().toISOString();
  saveLocalState(sharedState);

  if (!remote) return;

  // If a save is already in flight, just mark that another is pending — we'll
  // re-fire after the current one settles. This collapses bursts of clicks
  // into at-most-one-trailing PUT and avoids racing the server.
  if (pendingRemoteSave) {
    queuedRemoteSave = true;
    return;
  }
  pendingRemoteSave = true;

  // Snapshot what we sent so we can tell if the server pruned anything
  // (e.g. dropped a 30-day-old Read Later item) and rerender if so.
  // Skipping rerender when nothing changed avoids interrupting in-flight
  // dismiss animations on every save.
  const sentLaterCount = sharedState.later.length;
  const sentHistoryCount = sharedState.history.length;

  try {
    const remoteState = await saveRemoteState(sharedState);
    if (remoteState) applySharedState(remoteState);
    saveLocalState(sharedState);
    syncFailureCount = 0;
    setSyncStatus('idle');
    // Only a server-side aging of Read Later / History warrants a rerender.
    // readIds no longer shrink to the digest, and rerendering on a readIds
    // change would restructure the page mid-triage (the dismissed card would
    // be rebuilt and a new lead promoted under you).
    const pruned =
      sharedState.later.length < sentLaterCount ||
      sharedState.history.length < sentHistoryCount;
    if (pruned) rerenderActiveView();
  } catch (err) {
    syncFailureCount += 1;
    setSyncStatus('error', `Sync failed — retrying (${syncFailureCount})`);
    scheduleRetry();
    console.warn('Remote state save failed:', err);
  } finally {
    pendingRemoteSave = false;
    if (queuedRemoteSave) {
      queuedRemoteSave = false;
      saveSharedState().catch(() => {});
    }
  }
}

function rerenderActiveView() {
  buildCatNav();
  updateCatCounts();
  updateBadges();
  if (currentView === 'history') renderHistory();
  else if (currentView === 'later') renderLater();
  else if (currentView === 'settings') renderSettings();
  else if (currentView === 'onboarding') renderOnboarding();
  else render();
}

let pendingRemoteRefresh = false;
async function refreshFromRemote() {
  // Skip if a save is in flight — the PUT response already carries fresh state.
  if (pendingRemoteSave || pendingRemoteRefresh) return;
  pendingRemoteRefresh = true;
  try {
    const remote = await loadRemoteState();
    if (!remote) return;
    // A save that started while the GET was in flight means the snapshot we
    // just got is older than our local changes — applying it would clobber
    // the unsynced dismiss/later/history mutation and bring the article back.
    if (pendingRemoteSave) return;
    const changed = statesDiffer(sharedState, remote);
    applySharedState(remote);
    saveLocalState(sharedState);
    const votesChanged = await loadVotes();
    if ((changed || votesChanged) && currentView !== 'onboarding') rerenderActiveView();
  } catch (err) {
    console.warn('Remote state refresh failed:', err);
  } finally {
    pendingRemoteRefresh = false;
  }
}

/* ── State ────────────────────────────────────────────── */
let currentCat = 'all';
let currentView = 'digest';
let digestCat = 'all';

/* ── View switching ───────────────────────────────────── */

function setActiveView(view) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.viewnav-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('view-' + view).classList.add('active');
  document.getElementById('vnav-' + view)?.classList.add('active');
  // The wizard is full-focus: hide the category bar while it's open.
  const catbar = document.getElementById('catbar');
  if (catbar) catbar.style.display = (view === 'onboarding') ? 'none' : '';
  // The search box rides the view-nav row but only applies to Home.
  const search = document.getElementById('digest-search');
  if (search) search.style.display = (view === 'digest') ? '' : 'none';
}

function switchView(view) {
  // Save current digest category before leaving
  if (currentView === 'digest') digestCat = currentCat;

  // Reset category to all when switching to history or later
  if (view !== 'digest') currentCat = 'all';
  else currentCat = digestCat;

  currentView = view;
  sharedState.viewState = { ...sharedState.viewState,
    currentView: view === 'onboarding' ? (sharedState.viewState.currentView || 'digest') : view, currentCat, digestCat };
  saveSharedState().catch(() => {});

  setActiveView(view);
  buildCatNav();

  if (view === 'history')  renderHistory();
  if (view === 'later')    renderLater();
  if (view === 'digest')   render();
  if (view === 'settings') renderSettings();
  if (view === 'onboarding') renderOnboarding();
}

/* ── Helpers ──────────────────────────────────────────── */
function saveRead() {
  saveSharedState().catch(() => {});
}

// Rank score shown as a chip overlaid on the thumbnail, with a hover breakdown.
// Opt-in via Settings → Display (off by default). The chip number is the
// personalized effectiveScore — the value the feed sorts by. The popover shows
// how the raw Base relevance becomes that Score: same-topic coverage
// (cluster_boost), personalization (taste_boost), and the per-source affinity
// multiplier. Empty for items without a score (e.g. saved Read Later entries).
function scoreChip(a) {
  if (!sharedState.viewState.showScores) return '';
  if (!a || typeof a.score !== 'number') return '';
  const r = (n) => (Math.round(n * 10) / 10).toFixed(1);
  const base = a.score || 0;
  const eff = effectiveScore(a);
  const row = (k, v, cls = '') =>
    `<span class="score-row${cls ? ' ' + cls : ''}"><span class="score-row-k">${k}</span><span class="score-row-v">${v}</span></span>`;
  const rows = [row('Base', r(base))];
  if (a.cluster_boost) rows.push(row('Coverage', `+${r(a.cluster_boost)}`));
  if (a.taste_boost)   rows.push(row('For you', `+${r(a.taste_boost)}`));
  if (a.feedback_boost) rows.push(row('Likes', `${a.feedback_boost > 0 ? '+' : ''}${r(a.feedback_boost)}`));
  if (a.source_boost)  rows.push(row('Publisher', `${a.source_boost > 0 ? '+' : ''}${r(a.source_boost)}`));
  rows.push(row('Source', `×${r(affinityFor(a.source))}`));
  rows.push(row('Score', r(eff), 'score-row-total'));
  return `<span class="score-chip">`
    + `<span class="score-chip-val">${r(eff)}</span>`
    + `<span class="score-pop" role="tooltip"><span class="score-pop-title">Ranking</span>${rows.join('')}</span>`
    + `</span>`;
}

// Thumbnail wrapped in a non-clipping frame so the score chip (and its hover
// popover) can overlay the image — .thumb itself is overflow:hidden for the
// hover zoom, which would otherwise clip them.
function thumbBlock(a) {
  return `<div class="thumb-frame">${openLink(a, thumb(a))}${scoreChip(a)}</div>`;
}

function catMeta(c) { return CATS[c] || { label: c, c: '#8a90a0' }; }

// Image thumbnail with a category-tinted fallback. If the image fails (or there
// is none), the category-colored block with its label shows through.
function thumb(a) {
  const cat = catMeta(a.category);
  const tint = `color-mix(in srgb, ${cat.c} 22%, var(--surface2))`;
  const ph = `<div class="ph">${escapeHtml(cat.label || a.category || '')}</div>`;
  // Same reliable policy as onboarding: photo → local topic illustration (on
  // error too) → tinted label block underneath. Never a broken-image icon.
  const fb = fallbackFor(a);
  const src = a.image || fb;
  const im = `<img src="${escapeAttr(src)}" alt="" loading="lazy" referrerpolicy="no-referrer"`
    + `${a.image ? '' : ' class="is-fallback"'} data-fallback="${escapeAttr(fb)}" onerror="imgFallback(this)">`;
  // Count badge when this card rolls up duplicates — clearly visible on the image.
  const others = (a._clusterOthers || []).length;
  const badge = others > 0 ? `<span class="thumb-badge">＋${others}</span>` : '';
  return `<div class="thumb" style="background:${tint}">${ph}${im}${badge}</div>`;
}

// Category kicker (colored dot + label). Rollups are signalled by the "＋N"
// thumbnail badge and the expander, not a separate pill here.
function kicker(a) {
  const cat = catMeta(a.category);
  return `<span class="kicker" style="color:${cat.c}"><span class="cdot" style="background:${cat.c}"></span>${cat.label || a.category}</span>`;
}

function articleDate(article) {
  // Calendar-day buckets in the viewer's local timezone — not rolling 24h windows.
  // An article posted yesterday at 11pm should read "yesterday" at 1am, not "today".
  const pub = new Date(article.published_at);
  const today = new Date();
  const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
  const diffDays = Math.round((startOfDay(today) - startOfDay(pub)) / 86400000);
  if (diffDays <= 0) return 'today';
  if (diffDays === 1) return 'yesterday';
  return `${diffDays} days ago`;
}

function isToday(article) { return articleDate(article) === 'today'; }

function isInHistoryWindow(item) {
  if (!item || !item.viewedAt) return false;
  const t = new Date(item.viewedAt);
  if (isNaN(t)) return false;
  const cutoff = new Date();
  cutoff.setHours(0, 0, 0, 0);
  cutoff.setDate(cutoff.getDate() - (HISTORY_DAYS - 1));
  return t >= cutoff;
}

function laterIdSet() {
  return new Set(sharedState.later.map(a => a.id));
}

// History = items viewed within the window that are NOT currently saved to
// Read Later. Saving curates an item out of History; this is the single source
// of truth all three History surfaces (view, badge, category counts) use.
function historyItems() {
  const inLater = laterIdSet();
  return sharedState.history.filter(h => isInHistoryWindow(h) && !inLater.has(h.id));
}

function visible(article) {
  if (sharedState.readIds.has(article.id)) return false;
  if (sharedState.later.some(a => a.id === article.id)) return false;
  return currentCat === 'all' || article.category === currentCat;
}

// The inbox: every unread, not-saved story in the digest, de-duplicated to one
// rep per cluster. The pipeline now carries unread stories forward and prunes
// them by a rank-weighted lifespan, so the digest *is* the retained set — the
// client trusts it rather than re-applying its own recency window. Badges and
// category counts all derive from this so the numbers match the cards shown.
function inboxReps() {
  const inLater = laterIdSet();
  return dedupeToReps(allArticles.filter(
    a => !sharedState.readIds.has(a.id) && !inLater.has(a.id)));
}

function formatTime(isoString) {
  return new Date(isoString).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
}

function formatDateTime(isoString) {
  return new Date(isoString).toLocaleDateString('en-US', { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: true });
}

/* ── Copy ─────────────────────────────────────────────── */
function copyArticle(title, url, btn) {
  const text = title + '\n' + url;
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(() => flashCopy(btn)).catch(() => fallbackCopy(text, btn));
  } else {
    fallbackCopy(text, btn);
  }
}

function fallbackCopy(text, btn) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;opacity:0;';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); flashCopy(btn); } catch(e) { btn.textContent = 'Failed'; }
  document.body.removeChild(ta);
}

function flashCopy(btn) {
  const orig = btn.textContent;
  btn.textContent = 'Copied!';
  btn.classList.add('copied');
  setTimeout(() => { btn.textContent = orig; btn.classList.remove('copied'); }, 2000);
}

/* ── Learning: per-source affinity ────────────────────── */
// Counters live on sharedState.sourceStats and persist independently of
// readIds/later/history so inbox hygiene (clearing Later, history aging out)
// doesn't wipe preferences. Affinity is derived, not stored.
const AFFINITY_MIN          = 0.5;
const AFFINITY_MAX          = 2.0;
const WEIGHT_OPEN           = 0.10;
const WEIGHT_SAVE           = 0.20;
const WEIGHT_DISMISS        = 0.05;
const LEARNING_DECAY_DAYS   = 7;
const LEARNING_DECAY_FACTOR = 0.97;

function ensureSourceStat(source) {
  if (!sharedState.sourceStats) sharedState.sourceStats = {};
  if (!sharedState.sourceStats[source]) {
    sharedState.sourceStats[source] = { opens: 0, saves: 0, dismisses: 0 };
  }
  return sharedState.sourceStats[source];
}

function recordInteraction(source, kind) {
  if (!source) return;
  const s = ensureSourceStat(source);
  if (kind === 'open')          s.opens     += 1;
  else if (kind === 'save')     s.saves     += 1;
  else if (kind === 'dismiss')  s.dismisses += 1;
}

function affinityFor(source) {
  const s = sharedState.sourceStats && sharedState.sourceStats[source];
  if (!s) return 1.0;
  const v = 1.0 + WEIGHT_OPEN * s.opens + WEIGHT_SAVE * s.saves - WEIGHT_DISMISS * s.dismisses;
  if (v < AFFINITY_MIN) return AFFINITY_MIN;
  if (v > AFFINITY_MAX) return AFFINITY_MAX;
  return v;
}

function effectiveScore(article) {
  // Base relevance, plus same-topic coverage boost (cluster_boost) and the
  // personalization boost (taste_boost, baked in by the pipeline from what you
  // save/open), all lifted by the per-source affinity multiplier.
  // Explicit likes/dislikes (feedback_boost) and publisher affinity
  // (source_boost) come from the pipeline as well.
  return ((article.score || 0) + (article.cluster_boost || 0) + (article.taste_boost || 0)
          + (article.feedback_boost || 0) + (article.source_boost || 0))
    * affinityFor(article.source);
}

// Lazy time-decay: weight recent behavior more heavily by multiplying every
// counter by LEARNING_DECAY_FACTOR after LEARNING_DECAY_DAYS. Idempotent —
// runs at most once per decay window.
function maybeDecayLearning() {
  if (!sharedState.learning) sharedState.learning = { lastDecayAt: null };
  const last = sharedState.learning.lastDecayAt ? Date.parse(sharedState.learning.lastDecayAt) : 0;
  const now = Date.now();
  // First-ever run — set the clock without applying decay so we don't
  // wrongly age counters whose start time we never recorded.
  if (!last) {
    sharedState.learning.lastDecayAt = new Date(now).toISOString();
    return true;
  }
  if ((now - last) < LEARNING_DECAY_DAYS * 86400000) return false;
  if (sharedState.sourceStats) {
    for (const s of Object.values(sharedState.sourceStats)) {
      s.opens     *= LEARNING_DECAY_FACTOR;
      s.saves     *= LEARNING_DECAY_FACTOR;
      s.dismisses *= LEARNING_DECAY_FACTOR;
    }
  }
  sharedState.learning.lastDecayAt = new Date(now).toISOString();
  return true;
}

window.resetLearning = function() {
  sharedState.sourceStats = {};
  sharedState.learning = { lastDecayAt: new Date().toISOString() };
  saveSharedState().catch(() => {});
  rerenderActiveView();
};

/* ── Clustering: a cluster is one story ───────────────── */
// Mark every article in the same cluster as read so a multi-source story
// leaves Home as a single unit — Done on the card, opening any member, or
// saving the representative to Later all retire the whole cluster.
function markClusterRead(id) {
  const a = allArticles.find(x => x.id === id);
  if (!a) return;
  const cid = a.cluster_id || a.id;
  allArticles.forEach(x => { if ((x.cluster_id || x.id) === cid) sharedState.readIds.add(x.id); });
}

// Summarise a representative's cluster — the other articles semantically about
// the same topic that this card collapses. Source-agnostic: a duplicate is a
// duplicate whether it's the same outlet or a different one. Null for singletons.
function clusterInfo(a) {
  const others = a._clusterOthers || [];
  if (!others.length) return null;
  return { others, count: others.length + 1 };
}

// Expander listing the other same-topic articles folded into this card.
// Opening any of them retires the whole group.
function clusterDisclosure(a) {
  const ci = clusterInfo(a);
  if (!ci) return '';
  const items = ci.others.map(o => `<li>
        <span class="cluster-src">${o.source}</span>
        <a href="${o.url}" onclick="openClusterMember('${a.id}','${o.id}','${o.url}'); return false;">${o.title} <span class="cluster-ext">↗</span></a>
      </li>`).join('');
  const n = ci.others.length;
  return `<details class="cluster-more" onclick="event.stopPropagation();">
      <summary>Show ${n} collapsed article${n === 1 ? '' : 's'}</summary>
      <ul class="cluster-list">${items}</ul>
    </details>`;
}

window.openClusterMember = function(repId, memberId, url) {
  const member = allArticles.find(a => a.id === memberId);
  if (member) {
    if (!sharedState.history.find(h => h.id === memberId)) {
      sharedState.history.push({
        id: member.id, title: member.title, url: member.url,
        source: member.source, category: member.category,
        viewedAt: new Date().toISOString(),
      });
    }
    // Engagement credits the source actually clicked, not the representative.
    recordInteraction(member.source, 'open');
  }
  window.open(url, '_blank');
  // Opening any coverage marks the whole story read and removes the card.
  dismiss(repId, true);
  updateBadges();
};

/* ── Dismiss ──────────────────────────────────────────── */
window.dismiss = function(id, internal = false) {
  if (!internal) {
    const article = allArticles.find(a => a.id === id);
    if (article) recordInteraction(article.source, 'dismiss');
  }
  sharedState.readIds.add(id);
  markClusterRead(id);
  saveRead();
  // Fade the card out but keep its box (animateDismiss) — nothing else moves.
  // The layout re-flows only when you next enter the digest view.
  animateDismiss(id);
  updateCatCounts();
};

/* ── Open article ─────────────────────────────────────── */
function openArticle(id, url) {
  const article = allArticles.find(a => a.id === id);
  if (article) {
    if (!sharedState.history.find((h) => h.id === id)) {
      sharedState.history.push({
        id: article.id,
        title: article.title,
        url: article.url,
        source: article.source,
        category: article.category,
        viewedAt: new Date().toISOString(),
      });
      updateBadges();
    }
    recordInteraction(article.source, 'open');
    sharedState.readIds.add(id);
    saveSharedState().catch(() => {});
  }

  window.open(url, '_blank');
  // Pass internal=true so dismiss doesn't double-count this as a dismiss —
  // an open is positive signal, dismiss is the cleanup that follows.
  dismiss(id, true);
}

/* ── Save for later ───────────────────────────────────── */
function saveForLater(id) {
  const article = allArticles.find(a => a.id === id);
  if (!article) return;
  if (!sharedState.later.find((a) => a.id === id)) {
    sharedState.later.push({
      id: article.id,
      title: article.title,
      url: article.url,
      source: article.source,
      category: article.category,
      savedAt: new Date().toISOString(),
    });
  }
  // History is "viewed but not saved" — saving moves it out of History so an
  // item is never in both lists. (See also the laterIds guard in the views.)
  sharedState.history = sharedState.history.filter((h) => h.id !== id);
  recordInteraction(article.source, 'save');
  // Mutate readIds before the first save so the PUT payload carries both
  // changes — otherwise the server's response would replace the local readIds
  // addition that dismiss() makes a tick later. markClusterRead retires the
  // rest of the story so it leaves Home via the representative.
  sharedState.readIds.add(id);
  markClusterRead(id);
  saveSharedState().catch(() => {});
  updateBadges();
  animateDismiss(id);
  // Generate the TL;DR now so it's ready when you come back to read later.
  const saved = sharedState.later.find(a => a.id === id);
  if (saved && !(saved.tldr && saved.tldr.length)) requestTldr(id, saved.url, saved.title);
}

function animateDismiss(id) {
  // Fade the card to invisible but leave its box in place, so triaging never
  // shifts or resizes anything else. The card is gone from the data (readIds),
  // so the next render() — on revisit — rebuilds the layout without it.
  const el = document.getElementById('wrap-' + id);
  if (el) el.classList.add('removed');
}

/* ── Remove from later ────────────────────────────────── */
function removeFromLater(id) {
  sharedState.later = sharedState.later.filter((a) => a.id !== id);
  // Keep readIds in sync so the article doesn't reappear on Home when removed.
  sharedState.readIds.add(id);
  saveSharedState().catch(() => {});
  const el = document.getElementById('later-row-' + id);
  if (el) { el.style.opacity = '0'; setTimeout(() => { el.remove(); updateBadges(); renderLaterCount(); }, 260); }
}

/* ── Open from Read Later ─────────────────────────────── */
function openLaterArticle(id) {
  const article = sharedState.later.find((a) => a.id === id);
  if (!article) return;
  if (!sharedState.history.find((h) => h.id === id)) {
    sharedState.history.push({
      id: article.id,
      title: article.title,
      url: article.url,
      source: article.source,
      category: article.category,
      viewedAt: new Date().toISOString(),
    });
  }
  recordInteraction(article.source, 'open');
  sharedState.readIds.add(id);
  removeFromLater(id);
}

/* ── Category nav ─────────────────────────────────────── */
function buildCatNav() {
  const bar = document.getElementById('catbar');

  if (currentView === 'digest') {
    bar.style.display = 'flex';
    const counts = {};
    // Per-category tallies over the retained inbox (today + carried), as
    // stories — kept in step with the nav badge and the cards on screen.
    inboxReps().forEach(a => {
      counts.all = (counts.all || 0) + 1;
      counts[a.category] = (counts[a.category] || 0) + 1;
    });
    bar.innerHTML = Object.keys(CATS).map(key => {
      const c = CATS[key];
      const n = counts[key] || 0;
      const badge = n > 0 ? `<span class="badge">${n}</span>` : '';
      return `<button class="cattab${key === currentCat ? ' active' : ''}" data-cat="${key}" onclick="setCategory('${key}')">${c.c ? `<span class="cat-dot" style="background:${c.c}"></span>` : ''}${c.label}${badge}</button>`;
    }).join('');
  } else if (currentView === 'later') {
    bar.style.display = 'flex';
    const later = sharedState.later;
    const counts = {};
    later.forEach(a => {
      counts.all = (counts.all || 0) + 1;
      counts[a.category] = (counts[a.category] || 0) + 1;
    });
    bar.innerHTML = Object.keys(CATS).map(key => {
      const c = CATS[key];
      const n = counts[key] || 0;
      const badge = n > 0 ? `<span class="badge">${n}</span>` : '';
      return `<button class="cattab${key === currentCat ? ' active' : ''}" data-cat="${key}" onclick="setCategory('${key}')">${c.c ? `<span class="cat-dot" style="background:${c.c}"></span>` : ''}${c.label}${badge}</button>`;
    }).join('');
  } else if (currentView === 'history') {
    bar.style.display = 'flex';
    const hist = historyItems();
    const counts = {};
    hist.forEach(a => {
      counts.all = (counts.all || 0) + 1;
      if (a.category) counts[a.category] = (counts[a.category] || 0) + 1;
    });
    bar.innerHTML = Object.keys(CATS).map(key => {
      const c = CATS[key];
      const n = counts[key] || 0;
      const badge = n > 0 ? `<span class="badge">${n}</span>` : '';
      return `<button class="cattab${key === currentCat ? ' active' : ''}" data-cat="${key}" onclick="setCategory('${key}')">${c.c ? `<span class="cat-dot" style="background:${c.c}"></span>` : ''}${c.label}${badge}</button>`;
    }).join('');
  } else {
    // Settings (and any future non-list views) — no category filter applies.
    bar.style.display = 'none';
  }
}

function updateCatCounts() {
  buildCatNav();
  updateBadges();
  // Masthead tally next to the date: today's unread stories, de-duped on the
  // same basis as the Home badge/chips (inboxReps) but scoped to today and
  // labelled "today" so it reads distinctly from the full inbox count.
  const todayStories = inboxReps().filter(a => isToday(a)).length;
  document.getElementById('header-count').textContent = `${todayStories} today`;
}

window.setCategory = function(cat) {
  currentCat = cat;
  sharedState.viewState = { ...sharedState.viewState, currentView, currentCat, digestCat };
  saveSharedState().catch(() => {});
  buildCatNav();
  if (currentView === 'digest')  render();
  if (currentView === 'later')   renderLater();
  if (currentView === 'history') renderHistory();
};

/* ── Badges ───────────────────────────────────────────── */
function updateBadges() {
  const hist = historyItems();
  const later = sharedState.later;
  // Count the whole retained inbox (today + carried), de-duped to stories, so
  // the badge tracks what's actually available and doesn't reset each midnight.
  const unread = inboxReps().length;

  document.getElementById('badge-digest').textContent  = unread  || '';
  document.getElementById('badge-history').textContent = hist.length || '';
  document.getElementById('badge-later').textContent   = later.length || '';
}

/* ── Render digest ────────────────────────────────────── */
// Layout balance: the front page (hero + Latest grid) should never be a stub,
// and the single-column "Earlier this week" rail should track the grid's height
// rather than running far past it. FRONT_MIN is the fewest stories that make a
// proper front page (hero of 5 + ~2 grid rows); RAIL_MIN keeps the rail from
// going too sparse when the grid is short.
const FRONT_MIN = 11;
const RAIL_MIN = 6;
let railShowAll = false;

/* ── Search (Home) ────────────────────────────────────── */
// Hybrid filter, like the category chips — not a Q&A box. Instant client-side
// keyword matching over the loaded digest (always finds an exact term that's on
// the page), plus server-side semantic matches (the server embeds the query and
// cosine-ranks the stored embeddings) for meaning/paraphrase recall.
let digestSearchQuery   = '';
let digestSearchResults = null;   // [{id,score}] from /search, or null when idle
let digestSearchLoading = false;
let digestSearchTimer   = null;
let digestSearchSeq     = 0;      // drops out-of-order responses

window.onDigestSearchInput = function(value) {
  digestSearchQuery = value;
  clearTimeout(digestSearchTimer);
  if (!value.trim()) {            // cleared → back to the magazine
    digestSearchResults = null;
    digestSearchLoading = false;
    render();
    return;
  }
  digestSearchResults = null;     // drop stale semantic hits; keyword shows instantly
  digestSearchLoading = true;
  render();                        // client-side keyword matches render right away
  digestSearchTimer = setTimeout(() => runDigestSearch(value.trim()), 300);
};

async function runDigestSearch(q) {
  const seq = ++digestSearchSeq;
  try {
    const res = await fetch('/search?q=' + encodeURIComponent(q));
    const data = await res.json();
    if (seq !== digestSearchSeq) return;        // a newer query superseded this
    digestSearchResults = Array.isArray(data.results) ? data.results : [];
  } catch (e) {
    if (seq !== digestSearchSeq) return;
    digestSearchResults = [];
  } finally {
    if (seq === digestSearchSeq) {
      digestSearchLoading = false;
      if (currentView === 'digest') render();
    }
  }
}

function renderSearchResults() {
  const el = document.getElementById('search-results');
  const q  = digestSearchQuery.trim();
  const ql = q.toLowerCase();
  const byId = new Map(allArticles.map(a => [a.id, a]));
  const semIds = new Set((digestSearchResults || []).map(r => r.id));

  // Saved (Read Later) matches — highlighted at the top. Matched by keyword over
  // the saved item (incl. its TL;DR), or because it still surfaced semantically.
  const savedHits = sharedState.later.filter(a =>
    (currentCat === 'all' || a.category === currentCat) &&
    (semIds.has(a.id) ||
     (ql && (a.title + ' ' + (a.source || '') + ' ' + (a.bottomLine || '') + ' '
             + ((a.tldr || []).join(' '))).toLowerCase().includes(ql))));

  // Digest matches: semantic first (by similarity), then keyword over the loaded
  // page (safety net for index drift / sub-threshold similarity). visible()
  // already excludes saved items, so they only appear in the section above.
  // Search lists every match individually (dedupe by article id, not cluster)
  // and clears the rollup — a specific article that shares a cluster with
  // another must never be hidden under another card's "show more".
  const seen = new Set();   // article ids already placed
  const order = [];
  const add = (a) => {
    if (!a || !visible(a)) return;
    if (seen.has(a.id)) return;
    seen.add(a.id);
    a._clusterOthers = [];
    order.push(a);
  };
  for (const r of (digestSearchResults || [])) add(byId.get(r.id));
  if (ql) for (const a of allArticles) {
    if ((a.title + ' ' + (a.summary || '') + ' ' + (a.source || '')).toLowerCase().includes(ql)) add(a);
  }

  if (!savedHits.length && !order.length) {
    el.innerHTML = '<p class="sec-label">Search</p>'
      + (digestSearchLoading ? '<p class="empty">Searching…</p>'
                             : `<p class="empty">No stories match “${escapeAttr(q)}”.</p>`);
    return;
  }
  const more = digestSearchLoading ? ' …' : '';
  let html = '';
  if (savedHits.length) {
    html += `<p class="sec-label">Saved for later · ${savedHits.length}</p>`
      + `<div class="grid">${savedHits.map(savedCardHTML).join('')}</div>`;
  }
  if (order.length) {
    html += `<p class="sec-label">${order.length} result${order.length === 1 ? '' : 's'} for “${escapeAttr(q)}”${more}</p>`
      + `<div class="grid">${order.map(gridCardHTML).join('')}</div>`;
  }
  el.innerHTML = html;
}

function render() {
  // Semantic search active: swap the magazine for a ranked results list. The
  // magazine sections are emptied so their card ids don't collide with the
  // results' (dismiss/save find cards by `wrap-<id>`).
  const magazine = document.getElementById('digest-magazine');
  const resultsEl = document.getElementById('search-results');
  if (digestSearchQuery.trim()) {
    magazine.style.display = 'none';
    document.getElementById('section-hero').innerHTML = '';
    document.getElementById('section-grid').innerHTML = '';
    document.getElementById('rail-list').innerHTML = '';
    resultsEl.style.display = '';
    renderSearchResults();
    return;
  }
  resultsEl.style.display = 'none';
  resultsEl.innerHTML = '';
  if (COMPACT) { renderCompact(); return; }
  magazine.style.display = '';

  // Bucket and order by effectiveScore = (score + cluster_boost) × source-
  // affinity so the pipeline-assigned score still dictates the baseline, cross-
  // source coverage lifts a story, and sources you consistently engage with get
  // nudged upward (and dismissed sources down).
  // Collapse same-story coverage: group by cluster, reduce each to one
  // representative, and stash the rest on the rep for the coverage marker +
  // "+N more covering this" disclosure. Applied to both today and the rail.
  // One ranked inbox, split into today (by score) and earlier (carried, by
  // recency). The front page draws today first; if today can't fill it (you've
  // cleared the top), it borrows the best of earlier so no section sits empty.
  // Today is ranked by effectiveScore, then diversified (topic/publisher
  // variety + an exploration share) — see diversifyOrder().
  const today = diversifyOrder(dedupeToReps(allArticles.filter(a => isToday(a) && visible(a))));
  const earlier = dedupeToReps(allArticles.filter(a => !isToday(a) && visible(a)))
    .sort((a, b) => new Date(b.published_at) - new Date(a.published_at));

  let front = today;
  if (front.length < FRONT_MIN) front = front.concat(earlier.slice(0, FRONT_MIN - front.length));
  const promoted = new Set(front.map(a => a.id));

  // Magazine front page: top rep is the lead, next four are hero secondaries,
  // the rest is the Latest card grid.
  const lead = front[0] || null;
  const side = front.slice(1, 5);
  const gridCards = front.slice(5);

  // Rail = earlier not promoted, capped to roughly the grid's height so it never
  // runs far past the left column. Dismissing rail items pulls the reserve up
  // (re-render backfills at the end); "Show more" reveals it on demand.
  const railPool = earlier.filter(a => !promoted.has(a.id));
  const railCap = Math.max(RAIL_MIN, gridCards.length);
  const railShown = railShowAll ? railPool : railPool.slice(0, railCap);

  renderHero(lead, side);
  renderGrid(gridCards);
  renderRail(railShown, railPool.length - railShown.length);
}

// Group articles by cluster and return one representative each, with the other
// members attached as `_clusterOthers` for the coverage UI. Singletons (most
// articles) come back unchanged with an empty others list.
function dedupeToReps(list) {
  const byCluster = new Map();
  for (const a of list) {
    const cid = a.cluster_id || a.id;
    if (!byCluster.has(cid)) byCluster.set(cid, []);
    byCluster.get(cid).push(a);
  }
  const reps = [];
  for (const members of byCluster.values()) {
    members.sort((x, y) => effectiveScore(y) - effectiveScore(x));
    const rep = members.find(m => m.cluster_rep) || members[0];
    rep._clusterOthers = members.filter(m => m !== rep);
    reps.push(rep);
  }
  return reps;
}

function relTime(a) {
  const d = new Date(a.published_at), now = Date.now();
  const h = Math.floor((now - d) / 3600000);
  if (isNaN(h)) return '';
  if (h < 1) return 'now';
  if (h < 24) return h + 'h';
  return Math.floor(h / 24) + 'd';
}
function srcLine(a) {
  const t = relTime(a);
  return `<span class="src"><span class="src-name">${escapeHtml(a.publisher || a.source || '')}</span>${t ? `<time>· ${t}</time>` : ''}</span>`;
}
function cardActions(a) {
  return `<div class="card-actions">
      ${voteButtons(a)}
      <button class="act later" onclick="saveForLater('${a.id}')">Read later</button>
      <button class="act done" onclick="dismiss('${a.id}')" title="Hide (not a dislike)">Done</button>
    </div>`;
}
const openLink = (a, inner) =>

function gridCardHTML(a) {

function renderRail(articles, hidden = 0) {
  const el = document.getElementById('rail-list');
  if (!articles.length) { el.innerHTML = '<p class="empty" style="padding:8px 0;">All caught up.</p>'; return; }
  const groups = {};
  articles.forEach(a => { const d = articleDate(a); (groups[d] = groups[d] || []).push(a); });
  // A "show more" when the rail is capped, or "show less" once expanded past it.
  const moreCtl = hidden > 0
    ? `<button class="rail-more" onclick="toggleRailMore(true)">Show ${hidden} more</button>`
    : (railShowAll ? `<button class="rail-more" onclick="toggleRailMore(false)">Show less</button>` : '');
  el.innerHTML = Object.entries(groups).map(([day, arts]) => `

  `).join('') + moreCtl;
}

/* ── Render Read Later ────────────────────────────────── */
let laterSearchQuery = '';
let historySearchQuery = '';

function escapeAttr(s) {
  return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
}

// Hides .list-row elements inside container whose title+source don't match
// query. Driven off DOM text rather than the source array so the same helper
// works for both Later and History.
function applyListSearch(containerId, query) {
  const container = document.getElementById(containerId);
  if (!container) return;
  const q = (query || '').trim().toLowerCase();
  let visible = 0, total = 0;
  for (const row of container.querySelectorAll('.list-row')) {
    total++;
    if (!q) { row.style.display = ''; visible++; continue; }
    const title = (row.querySelector('.list-title')?.textContent || '').toLowerCase();
    const source = (row.querySelector('.list-source')?.textContent || '').toLowerCase();
    const match = title.includes(q) || source.includes(q);
    row.style.display = match ? '' : 'none';
    if (match) visible++;
  }
  const empty = container.querySelector('.search-empty');
  if (empty) empty.style.display = (q && total > 0 && visible === 0) ? 'block' : 'none';
}

window.onLaterSearchInput = function(value) {
  laterSearchQuery = value;

window.onHistorySearchInput = function(value) {

/* ── Read Later: TL;DR ────────────────────────────────── */
let tldrOpen = new Set();

// Generate (or regenerate) a TL;DR for a saved item via Ollama and persist it on
// the later item so it syncs across devices. Re-finds the item by id after each
// await because saveSharedState can replace sharedState mid-flight.
async function requestTldr(id, url, title) {
  const set = (fields) => {
    const it = sharedState.later.find(a => a.id === id);
    if (it) Object.assign(it, fields);
  };
  set({ tldrState: 'pending' });
  if (currentView === 'later') renderLater();
  try {
    const res = await fetch('/tldr', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, title }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    const bullets = Array.isArray(data.tldr) ? data.tldr : [];
    set({ tldr: bullets, bottomLine: data.bottom_line || '',
          readMinutes: Number(data.read_minutes) || 0,
          tldrState: (bullets.length || data.bottom_line) ? 'ready' : 'error' });
  } catch (e) {
    set({ tldrState: 'error' });
  }
  saveSharedState().catch(() => {});
  if (currentView === 'later') renderLater();
}

window.toggleTldr = function(id) {
  if (tldrOpen.has(id)) { tldrOpen.delete(id); renderLater(); return; }
  tldrOpen.add(id);
  const it = sharedState.later.find(a => a.id === id);
  // Generate on first open if missing (covers items saved before this feature
  // existed, or a previous failure).
  if (it && !(it.tldr && it.tldr.length) && it.tldrState !== 'pending') {
    requestTldr(id, it.url, it.title);
  } else {
    renderLater();
  }
};

window.retryTldr = function(id) {
  const it = sharedState.later.find(a => a.id === id);
  if (it) { tldrOpen.add(id); requestTldr(id, it.url, it.title); }
};

function tldrToggleBtn(a) {
  const busy = a.tldrState === 'pending' && !(a.tldr && a.tldr.length);
  return `<button class="list-btn tldr-toggle" onclick="toggleTldr('${a.id}')">${
    tldrOpen.has(a.id) ? '▾' : '▸'} ${busy ? 'Summarizing…' : 'TL;DR'}</button>`;
}

function tldrPanel(a) {
  if (!tldrOpen.has(a.id)) return '';
  const regen = (title) =>
    `<button class="tldr-regen-icon" onclick="retryTldr('${a.id}')" title="${title}" aria-label="${title}">↻</button>`;
  let inner;
  if (a.tldr && a.tldr.length) {
    const readMeta = a.readMinutes
      ? `<p class="tldr-read">≈ ${a.readMinutes} min read</p>` : '';
    inner = regen('Regenerate')
      + readMeta
      + `<ul class="tldr-list">${a.tldr.map(b => `<li>${escapeAttr(b)}</li>`).join('')}</ul>`
      + (a.bottomLine ? `<p class="tldr-bottom"><span>Bottom line:</span> ${escapeAttr(a.bottomLine)}</p>` : '');
  } else if (a.tldrState === 'pending') {
    inner = '<p class="tldr-status">Summarizing…</p>';
  } else {
    inner = regen('Retry') + '<p class="tldr-status">Couldn\'t summarize.</p>';
  }
  return `<div class="tldr-panel">${inner}</div>`;
}

/* ── Settings: feed management ────────────────────────── */
let feedsList = [];
let feedFormUrl = '';
let feedFormSource = '';
let feedFormCategory = '';
let feedFormStatus = { kind: 'idle', message: '' };

// In-session undo for removals — cleared on page reload, never persisted.
// Each entry is { feed, stats } so we can restore both the feeds.json entry
// and the sourceStats counters that the server wiped on remove.
let recentRemoves = [];

// Sort state for the Feeds table. The "natural" direction is asc for text
// columns and desc for numeric — clicking a column the first time picks that
// direction, clicking the same column again toggles.
let feedsTableSort = { col: 'activity', dir: 'desc' };
const FEED_SORT_NATURAL = {
  source: 'asc', category: 'asc',
  opens: 'desc', saves: 'desc', dismisses: 'desc',
  affinity: 'desc', activity: 'desc',
};

window.sortFeedsTable = function(col) {
  if (feedsTableSort.col === col) {
    feedsTableSort.dir = feedsTableSort.dir === 'asc' ? 'desc' : 'asc';
  } else {
    feedsTableSort.col = col;
    feedsTableSort.dir = FEED_SORT_NATURAL[col] || 'desc';
  }
  renderFeedsTable();
};

window.onFeedUrlInput    = function(v) { feedFormUrl = v; };
window.onFeedSourceInput = function(v) { feedFormSource = v; };
window.onFeedCatChange   = function(v) { feedFormCategory = v; };

function feedFormSetStatus(kind, message) {
  feedFormStatus = { kind, message };
  const el = document.getElementById('feed-form-status');
  if (!el) return;
  el.className = 'feed-status ' + kind;
  el.textContent = message;
}

function feedFormSetDisabled(disabled) {
  ['feed-url-input', 'feed-source-input', 'feed-cat-input', 'feed-validate-btn', 'feed-add-btn']
    .forEach(id => { const e = document.getElementById(id); if (e) e.disabled = disabled; });
}

window.validateFeed = async function() {
  const url = (feedFormUrl || '').trim();
  if (!url) { feedFormSetStatus('err', 'Enter a URL first'); return; }
  feedFormSetStatus('muted', 'Validating…');
  feedFormSetDisabled(true);
  try {
    const res = await fetch(`/feeds/check?url=${encodeURIComponent(url)}`);
    const data = await res.json();
    if (data.ok) {
      const titleNote = data.title ? ` — "${data.title}"` : '';
      feedFormSetStatus('ok', `Valid ${(data.kind || '').toUpperCase()} feed${titleNote}`);
      // Auto-fill source if the user hasn't typed one yet.
      if (!feedFormSource && data.title) {
        feedFormSource = data.title;
        const src = document.getElementById('feed-source-input');
        if (src) src.value = data.title;
      }
    } else {
      feedFormSetStatus('err', data.error || 'Validation failed');
    }
  } catch (e) {
    feedFormSetStatus('err', 'Request failed: ' + (e.message || e));
  } finally {
    feedFormSetDisabled(false);
  }
};

window.addFeed = async function() {
  const url = (feedFormUrl || '').trim();
  const source = (feedFormSource || '').trim();
  const category = (feedFormCategory || '').trim();
  if (!url || !source || !category) {
    feedFormSetStatus('err', 'URL, source, and category are all required');
    return;
  }
  feedFormSetStatus('muted', 'Adding…');
  feedFormSetDisabled(true);
  try {
    const res = await fetch('/feeds', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ url, source, category }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);
    // Reset the form on success.
    feedFormUrl = ''; feedFormSource = ''; feedFormCategory = '';
    ['feed-url-input', 'feed-source-input'].forEach(id => { const e = document.getElementById(id); if (e) e.value = ''; });
    const cat = document.getElementById('feed-cat-input'); if (cat) cat.value = '';
    feedFormSetStatus('ok', `Added “${data.source}”. New articles will appear after the next scheduled run.`);
    await refreshFeedsList();
  } catch (e) {
    feedFormSetStatus('err', e.message || String(e));
  } finally {
    feedFormSetDisabled(false);
  }
};

window.removeFeed = async function(url) {
  if (!url) return;
  if (!confirm(`Remove this feed?\n\n${url}`)) return;
  // Treat the DELETE as a pending save so an in-flight refreshFromRemote
  // can't apply a stale GET (taken before the delete) and resurrect the
  // ghost row. This piggybacks on the existing race guard.
  pendingRemoteSave = true;
  let succeeded = false;
  try {
    const res = await fetch(`/feeds?url=${encodeURIComponent(url)}`, { method: 'DELETE' });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    // Server already wiped sourceStats[source] — mirror locally so we don't
    // flash the ghost row before the next state sync.
    if (data.removed && data.removed.source && sharedState.sourceStats) {
      delete sharedState.sourceStats[data.removed.source];
      saveLocalState(sharedState);
    }
    if (data.removed) {
      recentRemoves.push({ feed: data.removed, stats: data.stats || null });
    }
    succeeded = true;
  } catch (e) {
    alert('Failed to remove: ' + (e.message || e));
  } finally {
    pendingRemoteSave = false;
    if (queuedRemoteSave) {
      queuedRemoteSave = false;
      saveSharedState().catch(() => {});
    }
  }
  if (succeeded) {
    await refreshFeedsList();
    renderRecentRemoves();
  }
};

window.undoRemove = async function(idx) {
  const entry = recentRemoves[idx];
  if (!entry) return;
  pendingRemoteSave = true;
  let succeeded = false;
  try {
    // skip_validate — the URL was verified at original-add time and a
    // flaky revalidation shouldn't block an undo.
    const res = await fetch('/feeds?skip_validate=1', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(entry.feed),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`);

    // Restore the stats locally and push them up through the normal save
    // path so the server (and any other devices) pick them back up.
    if (entry.stats && entry.feed && entry.feed.source) {
      if (!sharedState.sourceStats) sharedState.sourceStats = {};
      sharedState.sourceStats[entry.feed.source] = entry.stats;
      saveLocalState(sharedState);
    }
    recentRemoves.splice(idx, 1);
    succeeded = true;
  } catch (e) {
    alert('Failed to restore: ' + (e.message || e));
  } finally {
    pendingRemoteSave = false;
    if (queuedRemoteSave) {
      queuedRemoteSave = false;
      saveSharedState().catch(() => {});
    }
  }
  if (succeeded) {
    // Ensure the restored stats reach the server via a fresh PUT.
    if (entry.stats) saveSharedState().catch(() => {});
    await refreshFeedsList();
    renderRecentRemoves();
  }
};

function renderRecentRemoves() {
  const wrap = document.getElementById('recent-removes-wrap');

  if (recentRemoves.length === 0) {

  wrap.innerHTML = `
    <div class="recent-removes">
      <div class="recent-removes-label">Recently removed — restorable until page reload</div>
      <div class="recent-removes-items">
        ${recentRemoves.map((entry, i) => `
          <span class="recent-remove-pill">
            <span class="recent-remove-name">${escapeAttr(entry.feed.source || entry.feed.url || '')}</span>
            <button class="recent-remove-undo" onclick="undoRemove(${i})">Restore</button>
          </span>
        `).join('')}
      </div>
    </div>
  `;
}

async function refreshFeedsList() {

// Unified table: configured feeds + sources with recorded activity (the
// latter as "ghost" rows when a feed has been removed but its stats survive).
// Lets the user see "this source has high dismisses" and remove it without
// scrolling to a separate section.
function renderFeedsTable() {
  const wrap = document.getElementById('feed-table-wrap');
  if (!wrap) return;

  const stats = sharedState.sourceStats || {};
  const bySource = new Map(feedsList.map(f => [f.source, f]));
  const allSources = new Set([...bySource.keys(), ...Object.keys(stats)]);

  const rows = [...allSources].map(source => {
    const feed = bySource.get(source);
    const s = stats[source] || { opens: 0, saves: 0, dismisses: 0 };
    let site = null;
    if (feed && feed.url) { try { site = new URL(feed.url).origin; } catch (e) {} }
    return {
      source,
      url: feed ? feed.url : null,
      site,
      category: feed ? feed.category : null,
      opens: s.opens, saves: s.saves, dismisses: s.dismisses,
      affinity: affinityFor(source),
      activity: s.opens + s.saves + s.dismisses,
      isConfigured: !!feed,
    };
  });

  // Ghosts always sit at the bottom regardless of sort — they're historical
  // and not actionable. Within each group (configured / ghost), apply the
  // user's chosen column + direction.
  const dirMult = feedsTableSort.dir === 'desc' ? -1 : 1;
  const sortKey = (r) => {
    const c = feedsTableSort.col;
    if (c === 'source')   return r.source.toLowerCase();
    if (c === 'category') return r.category ? (CATS[r.category]?.label || r.category).toLowerCase() : '￿';
    return r[c]; // numeric
  };
  rows.sort((a, b) => {
    if (a.isConfigured !== b.isConfigured) return a.isConfigured ? -1 : 1;
    const ka = sortKey(a), kb = sortKey(b);
    if (ka < kb) return -dirMult;
    if (ka > kb) return dirMult;
    return a.source.localeCompare(b.source); // stable tie-break
  });

  // Keep the count chip in the section header in sync with the feed list.
  const totalEl = document.getElementById('feed-total-count');
  if (totalEl) totalEl.textContent = `${feedsList.length} configured`;

  if (rows.length === 0) {
    wrap.innerHTML = '<p class="empty" style="padding: 12px 0;">No feeds yet. Add one above.</p>';
    return;
  }

  const fmt1 = (n) => (Math.round(n * 10) / 10).toFixed(1).replace(/\.0$/, '');
  const th = (col, label, numeric = false) => {
    const active = feedsTableSort.col === col;
    const arrow  = active ? (feedsTableSort.dir === 'desc' ? '▼' : '▲') : '';
    return `<th class="sortable${active ? ' active' : ''}${numeric ? ' num' : ''}" onclick="sortFeedsTable('${col}')">${label}<span class="sort-arrow">${arrow}</span></th>`;
  };

  wrap.innerHTML = `
    <table class="stats-table">
      <thead>
        <tr>
          ${th('source', 'Source')}
          ${th('category', 'Category')}
          ${th('opens', 'Opens', true)}
          ${th('saves', 'Saves', true)}
          ${th('dismisses', 'Dismisses', true)}
          ${th('affinity', 'Affinity', true)}
          <th></th>
        </tr>
      </thead>
      <tbody>
        ${rows.map(r => {
          const affClass = r.affinity > 1.05 ? 'aff-up' : r.affinity < 0.95 ? 'aff-down' : 'aff-neutral';
          const z = (n) => n === 0 ? ' zero' : '';
          const catCell = r.category
            ? escapeAttr(CATS[r.category]?.label || r.category)
            : '<span class="cat-dash">—</span>';
          const actionCell = r.isConfigured
            ? `<button class="cat-del" data-url="${escapeAttr(r.url)}" onclick="removeFeed(this.dataset.url)" aria-label="Remove feed" title="Remove feed">✕</button>`
            : '<span class="ghost-tag">removed</span>';
          return `
            <tr${r.isConfigured ? '' : ' class="ghost-row"'}>
              <td>
                ${r.site
                  ? `<a class="feed-cell-name feed-site-link" href="${escapeAttr(r.site)}" target="_blank" rel="noopener" title="Visit ${escapeAttr(r.site)}">${escapeAttr(r.source)}<span class="ext">↗</span></a>`
                  : `<div class="feed-cell-name">${escapeAttr(r.source)}</div>`}
                ${r.url ? `<div class="feed-cell-url" title="${escapeAttr(r.url)}">${escapeAttr(r.url)}</div>` : ''}
              </td>
              <td>${catCell}</td>
              <td class="num${z(r.opens)}">${fmt1(r.opens)}</td>
              <td class="num${z(r.saves)}">${fmt1(r.saves)}</td>
              <td class="num${z(r.dismisses)}">${fmt1(r.dismisses)}</td>
              <td class="num ${affClass}">${r.affinity.toFixed(2)}×</td>
              <td class="actions">${actionCell}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
  `;
}

function fmtDuration(s) {
  if (s == null) return '—';
  if (s < 60) return `${Math.round(s)}s`;
  return `${Math.floor(s / 60)}m ${Math.round(s % 60)}s`;
}

// Derive Ollama health from a run's scoring metrics: distinguishes Ollama being
// down (many fallbacks), running on CPU (model not in VRAM / high latency), and
// healthy. Returns null when the run did no scoring (empty / carried-only).
function runHealth(r) {
  const sc = r.scored_count || 0;
  if (!sc) return null;
  const fb = r.score_fallbacks || 0;
  const avgS = r.avg_score_ms != null ? r.avg_score_ms / 1000 : null;
  const gpu = r.gpu_ratio;                       // null if unknown
  const per = avgS != null ? `${avgS.toFixed(1)}s/story` : '';
  if (fb >= Math.max(3, sc * 0.5))
    return { level: 'bad', label: 'Ollama down?', detail: `${fb}/${sc} scoring calls failed — Ollama may be down (restart it)` };
  if (fb > 0)
    return { level: 'warn', label: `${fb} errors`, detail: `${fb}/${sc} scoring calls failed${per ? ' · ' + per : ''}` };
  if (gpu != null && gpu < 0.9)
    return { level: 'bad', label: 'on CPU', detail: `chat model only ${Math.round(gpu * 100)}% in VRAM${per ? ' · ' + per : ''} — GPU dropped?` };
  if (avgS != null && avgS >= 12)
    return { level: 'warn', label: 'slow', detail: `${per} — possibly running on CPU` };
  return { level: 'ok', label: per || 'ok', detail: gpu === 1 ? 'model on GPU' : '' };
}

function renderRunsTable(wrap, runs, status) {
  const cutoff = Date.now() - 24 * 3600 * 1000;
  const recent = runs
    .filter(r => { const t = Date.parse(r.started_at); return !isNaN(t) && t >= cutoff; })
    .sort((a, b) => Date.parse(b.started_at) - Date.parse(a.started_at));

  const liveRow = status && status.running ? `
    <tr class="run-live">
      <td>${status.started_at ? formatDateTime(status.started_at) : 'now'}</td>
      <td><span class="run-badge running">running${status.phase ? ' · ' + status.phase : ''}</span></td>
      <td class="num">—</td>
      <td class="num">${status.feed_count == null ? '—' : status.feed_count}</td>
      <td class="num">—</td>
      <td class="num">—</td>
      <td>—</td>
    </tr>` : '';

  if (!recent.length && !liveRow) {
    wrap.innerHTML = '<p class="empty" style="padding:16px 0;">No runs in the last 24 hours.</p>';
    return;
  }

  // Health banner from the most recent run that actually scored via Ollama.
  const lastScored = recent.find(r => (r.scored_count || 0) > 0);
  const h = lastScored ? runHealth(lastScored) : null;
  const banner = !h ? '' :
    h.level !== 'ok'
      ? `<div class="run-banner ${h.level}">⚠ Ollama ${h.label} — ${h.detail}</div>`
      : `<div class="run-banner ok">✓ Ollama healthy — last run ${h.label}${h.detail ? ', ' + h.detail : ''}</div>`;

  const failures = recent.filter(r => r.status === 'failed').length;
  const badge = (r) =>
    r.status === 'ok'     ? '<span class="run-badge ok">OK</span>' :
    r.status === 'failed' ? '<span class="run-badge fail">Failed</span>' :
                            '<span class="run-badge empty">No new</span>';
  const cell = (v) => (v == null ? '—' : v);
  const ollamaCell = (r) => {
    const hh = runHealth(r);
    if (!hh) return '<span class="run-ollama na">—</span>';
    return `<span class="run-ollama ${hh.level}" title="${escapeAttr(hh.detail || hh.label)}">${hh.label}</span>`;
  };

  wrap.innerHTML = `
    ${banner}
    <div class="run-summary">${recent.length} run${recent.length === 1 ? '' : 's'} in the last 24h${failures ? ` · <span class="run-fail-note">${failures} failed</span>` : ''}</div>
    <table class="stats-table runs-table">
      <thead>
        <tr><th>Started</th><th>Result</th><th class="num">Took</th><th class="num">Feeds</th><th class="num">Gathered</th><th class="num">In digest</th><th>Ollama</th></tr>
      </thead>
      <tbody>
        ${liveRow}
        ${recent.map(r => `
          <tr>
            <td>${formatDateTime(r.started_at)}</td>
            <td>${badge(r)}${r.error ? `<div class="run-err" title="${escapeAttr(r.error)}">${escapeAttr(r.error)}</div>` : ''}</td>
            <td class="num">${fmtDuration(r.duration_s)}</td>
            <td class="num">${cell(r.feed_count)}</td>
            <td class="num">${cell(r.new_count)}</td>
            <td class="num">${cell(r.article_count)}</td>
            <td>${ollamaCell(r)}</td>
          </tr>`).join('')}
      </tbody>
    </table>`;
}

function drawCatEditor() {

        <button class="cat-move" ${i === catEditList.length - 1 ? 'disabled' : ''} onclick="moveCat(${i},1)" aria-label="Move down">↓</button>

          <button class="cat-del" onclick="deleteCat(${i})" aria-label="Remove category">✕</button>
        </div>
        <input class="cat-input cat-interest" placeholder="What you want here — a real sentence; the scorer ranks against it" value="${escapeAttr(c.interest || '')}" oninput="editCat(${i},'interest',this.value)">
      </div>
    </div>`).join('');
  pane.innerHTML = `

      <div class="settings-help">
        Categories define what the digest is about. The <b>interest</b> line is woven into the scorer's
        prompt — write a real sentence about what you actually want in that bucket; that's what makes
        ranking good. Order = priority. Changes apply on the next run.
      </div>
      <div class="cat-list">${rows || '<p class="cfg-help">No categories yet — add one below.</p>'}</div>
      <button class="feed-btn" onclick="addCat()">+ Add category</button>
      <div class="cfg-actions" style="margin-top:18px;">
        <button class="feed-btn primary" onclick="saveCategories()">Save categories</button>
        <span class="cfg-status" id="cfg-status-cats"></span>
      </div>
    </div>`;
}

window.editCat = (i, field, val) => { if (catEditList[i]) catEditList[i][field] = val; };
window.moveCat = (i, dir) => {
  const j = i + dir;
  if (j < 0 || j >= catEditList.length) return;
  [catEditList[i], catEditList[j]] = [catEditList[j], catEditList[i]];
  drawCatEditor();
};
window.deleteCat = (i) => { catEditList.splice(i, 1); drawCatEditor(); };
window.addCat = () => { catEditList.push({ key: '', label: '', color: '#8a90a0', interest: '' }); drawCatEditor(); };

window.saveCategories = async () => {
  const cleaned = catEditList.map(c => ({
    key: (c.key || '').trim().toLowerCase(),
    label: (c.label || '').trim(),
    color: c.color || '#8a90a0',
    interest: (c.interest || '').trim(),
  })).filter(c => c.key);
  const keys = cleaned.map(c => c.key);
  if (!cleaned.length) return setCfgStatus('cats', 'err', 'Add at least one category.');
  if (new Set(keys).size !== keys.length) return setCfgStatus('cats', 'err', 'Keys must be unique.');
  if (keys.some(k => !/^[a-z0-9]{1,20}$/.test(k))) return setCfgStatus('cats', 'err', 'Keys: lowercase letters/numbers only, no spaces.');
  if (cleaned.some(c => !c.label)) return setCfgStatus('cats', 'err', 'Every category needs a label.');
  setCfgStatus('cats', 'muted', 'Saving…');
  try {
    const res = await fetch('/categories', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cleaned) });
    if (!res.ok) { const e = await res.json().catch(() => ({})); throw new Error(e.error || ('HTTP ' + res.status)); }
    const saved = await res.json();
    catEditList = saved.map(c => ({ ...c }));
    buildCats(saved);   // nav + card colours update live for when you return to Home
    drawCatEditor();
    setCfgStatus('cats', 'ok', 'Saved — applies on the next run.');
  } catch (e) { setCfgStatus('cats', 'err', e.message || String(e)); }
};

function visibleSettingsTabs() {
  const tabs = SETTINGS_TABS.filter(t => isAdmin() || !['models', 'runs'].includes(t.id));
  if (multiUser()) {
    if (isAdmin()) tabs.splice(tabs.length - 1, 0, { id: 'users', label: 'Users' });

/* ── OPML import wizard ───────────────────────────────── */
let opmlFeeds = [];      // [{url, source, folder}] parsed from the file
let opmlFolders = [];    // distinct folder names, in order
let opmlMap = {};        // folder -> existing category key | '__create__' | '__skip__'
let opmlValidate = true;

const CAT_PALETTE = ['#7b5cff','#2b7fff','#ff5a3c','#10b981','#d98a3b','#e84d9c',
                     '#3fae46','#06b6d4','#8a90a0','#e8482b','#f59e0b','#14b8a6'];
const slugKey = s => (s || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 20);
function pickCatColor(used) {
  for (const c of CAT_PALETTE) if (!used.has(c)) return c;
  return CAT_PALETTE[(opmlFolders.length) % CAT_PALETTE.length];
}

// Parse an OPML/XML string into feeds with their folder (category) name.
function parseOpml(text) {
  const doc = new DOMParser().parseFromString(text, 'application/xml');
  if (doc.querySelector('parsererror')) throw new Error('That doesn’t look like a valid OPML/XML file.');
  const out = [], seen = new Set();
  doc.querySelectorAll('outline[xmlUrl]').forEach(o => {
    const url = (o.getAttribute('xmlUrl') || '').trim();
    if (!url || seen.has(url)) return;
    seen.add(url);
    const source = (o.getAttribute('title') || o.getAttribute('text') || url).trim();
    const p = o.parentElement;
    const folder = (p && p.tagName.toLowerCase() === 'outline' && !p.getAttribute('xmlUrl'))
      ? (p.getAttribute('title') || p.getAttribute('text') || '').trim() : '';
    out.push({ url, source, folder });
  });
  return out;
}

window.onOpmlFile = function(input) {
  const file = input.files && input.files[0];
  input.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    let feeds;
    try { feeds = parseOpml(reader.result); }
    catch (e) { alert(e.message || 'Could not parse the file.'); return; }
    if (!feeds.length) { alert('No feeds (<outline xmlUrl="…">) were found in that file.'); return; }
    openImportWizard(feeds);
  };
  reader.readAsText(file);
};

function openImportWizard(feeds) {
  opmlFeeds = feeds;
  opmlValidate = true;
  const byFolder = {};
  opmlFolders = [];
  for (const f of feeds) {
    if (!(f.folder in byFolder)) { byFolder[f.folder] = []; opmlFolders.push(f.folder); }
    byFolder[f.folder].push(f);
  }
  // Default mapping: reuse an existing category whose key/label matches the
  // folder; otherwise offer to create one from the folder name.
  const existing = Object.keys(CATS).filter(k => k !== 'all');
  opmlMap = {};
  for (const folder of opmlFolders) {
    const s = slugKey(folder);
    const match = existing.find(k => k === s || (CATS[k].label || '').toLowerCase() === folder.toLowerCase());
    opmlMap[folder] = match || '__create__';
  }
  renderImportWizard(byFolder);
}

function opmlCatSelect(i) {
  const folder = opmlFolders[i], cur = opmlMap[folder];
  const opts = Object.keys(CATS).filter(k => k !== 'all')
    .map(k => `<option value="${k}"${cur === k ? ' selected' : ''}>${escapeAttr(CATS[k].label)}</option>`).join('');
  const createLabel = folder || 'Imported';
  return `<select class="cfg-select" onchange="setOpmlMap(${i}, this.value)">
      ${opts}
      <option value="__create__"${cur === '__create__' ? ' selected' : ''}>＋ Create “${escapeAttr(createLabel)}”</option>
      <option value="__skip__"${cur === '__skip__' ? ' selected' : ''}>Skip these</option>
    </select>`;
}

function renderImportWizard(byFolder) {
  const n = opmlFeeds.length, g = opmlFolders.length;
  const modal = document.createElement('div');
  modal.className = 'modal-overlay';
  modal.id = 'opml-modal';
  modal.innerHTML = `
    <div class="modal">
      <div class="modal-h">Import OPML</div>
      <div class="modal-help">${n} feed${n === 1 ? '' : 's'} in ${g} group${g === 1 ? '' : 's'}. Map each group to a category — <strong>Create</strong> makes a new one from the folder name (refine its interest description later in Settings → Categories).</div>
      <div class="opml-groups">
        ${opmlFolders.map((folder, i) => `
          <div class="opml-group">
            <div class="opml-group-name">${folder ? escapeAttr(folder) : '<em>(No folder)</em>'} <span class="opml-count">${byFolder[folder].length}</span></div>
            ${opmlCatSelect(i)}
          </div>`).join('')}
      </div>
      <label class="opml-validate"><input type="checkbox" checked onchange="opmlValidate = this.checked"> Validate each feed before adding (slower, but drops dead URLs)</label>
      <div class="modal-actions">
        <span class="cfg-status" id="opml-status"></span>
        <button class="feed-btn" onclick="closeOpmlModal()">Cancel</button>
        <button class="feed-btn primary" id="opml-import-btn" onclick="commitOpmlImport()">Import</button>
      </div>
    </div>`;
  modal.addEventListener('click', e => { if (e.target === modal) closeOpmlModal(); });
  document.body.appendChild(modal);
}

window.setOpmlMap = function(i, v) { opmlMap[opmlFolders[i]] = v; };
window.closeOpmlModal = function() { const m = document.getElementById('opml-modal'); if (m) m.remove(); };

window.commitOpmlImport = async function() {
  const btn = document.getElementById('opml-import-btn');
  setOpmlStatus('muted', 'Importing…');
  if (btn) btn.disabled = true;
  try {
    const usedKeys = new Set(Object.keys(CATS).filter(k => k !== 'all'));
    const usedColors = new Set(Object.values(CATS).map(c => c.c).filter(Boolean));
    const newCats = [], folderKey = {};
    for (const folder of opmlFolders) {
      const choice = opmlMap[folder];
      if (choice === '__skip__') continue;
      if (choice === '__create__') {
        let base = slugKey(folder) || 'imported', k = base, n = 2;
        while (usedKeys.has(k)) k = base.slice(0, 18) + n++;
        usedKeys.add(k);
        const color = pickCatColor(usedColors); usedColors.add(color);
        const label = (folder || 'Imported').slice(0, 40);
        newCats.push({ key: k, label, color, interest: label });
        folderKey[folder] = k;
      } else if (CATS[choice]) {
        folderKey[folder] = choice;
      }
    }
    const feeds = opmlFeeds.filter(f => folderKey[f.folder])
      .map(f => ({ url: f.url, source: f.source, category: folderKey[f.folder] }));
    if (!feeds.length) { setOpmlStatus('err', 'Nothing to import — every group is skipped.'); if (btn) btn.disabled = false; return; }

    if (newCats.length) {
      const current = await fetch('/categories', { cache: 'no-store' }).then(r => r.json()).catch(() => []);
      const merged = [...(Array.isArray(current) ? current : []), ...newCats];
      const r = await fetch('/categories', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(merged) });
      if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.error || ('categories HTTP ' + r.status)); }
      buildCats(await r.json());
    }
    const ir = await fetch('/feeds/import', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ feeds, validate: opmlValidate }) });
    if (!ir.ok) { const e = await ir.json().catch(() => ({})); throw new Error(e.error || ('import HTTP ' + ir.status)); }
    showOpmlSummary(await ir.json(), newCats.length);
  } catch (e) {
    setOpmlStatus('err', e.message || String(e));
    if (btn) btn.disabled = false;
  }
};

function showOpmlSummary(sum, newCatCount) {
  const fails = [...(sum.failed || []), ...(sum.invalid || [])];
  const modal = document.querySelector('#opml-modal .modal');
  if (!modal) return;
  modal.innerHTML = `
    <div class="modal-h">Import complete</div>
    <p class="opml-summary">Added <strong>${sum.added}</strong> feed${sum.added === 1 ? '' : 's'}${newCatCount ? `, created <strong>${newCatCount}</strong> categor${newCatCount === 1 ? 'y' : 'ies'}` : ''}.
      ${sum.skipped_dupes ? ` Skipped ${sum.skipped_dupes} duplicate${sum.skipped_dupes === 1 ? '' : 's'}.` : ''}
      ${fails.length ? ` ${fails.length} couldn’t be added.` : ''}
      New feeds appear after the next run.</p>
    ${fails.length ? `<div class="opml-fail-list">${fails.slice(0, 40).map(x => `<div class="opml-fail"><span>${escapeAttr(x.source || x.url || '?')}</span> — ${escapeAttr(x.error || 'failed')}</div>`).join('')}</div>` : ''}
    <div class="modal-actions">
      <button class="feed-btn primary" onclick="finishOpmlImport()">Done</button>
    </div>`;
}

let appSettingsSchema = null;
let deployInfo = null;
let availableModels = null;   // { ok, models:[...], error? } from GET /models

    method: 'PUT',

  if (!res.ok) {

function setCfgStatus(scope, kind, message) {

function numberField(key, spec, value) {
  const step = spec.type === 'float' ? (spec.step || 0.01) : 1;

    <label class="cfg-label" for="cfg-${key}">${spec.label}
      <span class="cfg-help">${spec.help || ''}</span>

function renderNumericGroup(group, title) {
  // Global (admin-only) knobs are hidden from regular users.
  const entries = Object.entries(appSettingsSchema)
    .filter(([, s]) => s.group === group && s.type !== 'list' && s.editable !== false);
  if (!entries.length) return '';
  return `<div class="settings-section">
    <div class="settings-h">${title}</div>
    <div class="cfg-grid">
      ${entries.map(([key, spec]) => numberField(key, spec, appSettings[key])).join('')}

      <button class="feed-btn primary" onclick="saveConfigGroup('${group}')">Save</button>

}

window.saveConfigGroup = async function(group) {
  const patch = {};
  for (const [key, spec] of Object.entries(appSettingsSchema)) {
    if (spec.group === group && spec.type !== 'list') {
      const el = document.getElementById('cfg-' + key);
      if (el && el.value !== '') {
        patch[key] = spec.type === 'float' ? parseFloat(el.value) : parseInt(el.value, 10);
      }
    }
  }
  setCfgStatus(group, 'muted', 'Saving…');
  try {
    await saveSettings(patch);
    // Reflect any server-side clamping back into the inputs.
    for (const [key, spec] of Object.entries(appSettingsSchema)) {
      if (spec.group === group && spec.type !== 'list') {
        const el = document.getElementById('cfg-' + key);
        if (el) el.value = appSettings[key];
      }
    }
    setCfgStatus(group, 'ok', 'Saved — applies on the next run.');
  } catch (e) {
    setCfgStatus(group, 'err', e.message || String(e));
  }
};

    `<span class="kw-chip">${escapeAttr(t)}<button class="kw-chip-x" title="Remove" onclick="removeListItemAt('${key}',${i})">×</button></span>`
  ).join('');

/* ── Toast ────────────────────────────────────────────── */
let toastTimer = null;
function toast(msg, ms = 2600) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast'; el.className = 'toast'; el.setAttribute('role', 'status');
    document.body.appendChild(el);

  el.textContent = msg;
  el.style.display = '';
